function blank(){return {fields:{},scores:{},evidence:{},potential:{},potentialEvidence:{},reportGenerated:false}}
let app={version:1,active:'primary',stages:{primary:blank(),middle:blank(),high:blank()}};
let storageAvailable=true;
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(validBackup(p))app=p;else storageAvailable=false}}catch(e){storageAvailable=false}
function validBackup(x){return !!(x&&x.version===1&&Object.keys(STAGES).includes(x.active)&&x.stages&&Object.keys(STAGES).every(k=>{const v=x.stages[k];return v&&['fields','scores','evidence','potential','potentialEvidence'].every(t=>v[t]&&typeof v[t]==='object'&&!Array.isArray(v[t]))&&Object.values(v.scores).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.values(v.potential).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.entries(v.fields).every(([k,n])=>['paths','majors'].includes(k)?Array.isArray(n)&&n.every(t=>typeof t==='string'):typeof n==='string')&&Object.values(v.evidence).every(n=>typeof n==='string')&&Object.values(v.potentialEvidence).every(n=>typeof n==='string')}))}
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>app.stages[app.active];const f=k=>current().fields[k]??'';const arr=k=>Array.isArray(f(k))?f(k):[];const num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):null;
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(app));storageAvailable=true;$('saveStatus').innerHTML='<span class="status-dot"></span>已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('mobileSave').textContent='已保存到本浏览器 · 三学段分别保存一份当前首面'}catch(e){storageAvailable=false;$('saveStatus').textContent='本地保存不可用 · 请导出备份';$('mobileSave').textContent='自动保存不可用，请先导出数据备份。'}}
function input(key,label,type='text',placeholder='',cls=''){return `<label class="field ${cls}"><span>${esc(label)}</span><input data-field="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(f(key))}" placeholder="${esc(placeholder)}"></label>`}
function area(key,label,placeholder='',cls='full'){return `<label class="field ${cls}"><span>${esc(label)}</span><textarea data-field="${key}" placeholder="${esc(placeholder)}">${esc(f(key))}</textarea></label>`}
function select(key,label,options,cls=''){return `<label class="field ${cls}"><span>${esc(label)}</span><select data-field="${key}"><option value="">请选择 / 待了解</option>${options.map(o=>`<option ${f(key)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
function checks(key,label,options){return `<div class="field full"><span>${esc(label)}</span><div class="choices">${options.map(o=>`<label class="choice"><input data-check="${key}" type="checkbox" value="${esc(o)}" ${arr(key).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`}
function section(id,no,title,sub,body){return `<section id="${id}" class="card editor"><div class="section-head"><span class="section-no">${no}</span><div><h2>${title}</h2><p>${sub}</p></div></div>${body}</section>`}
function basicForm(){return `<div class="fields">${input('name','学生姓名','text','请输入姓名')}${select('grade','当前年级',STAGES[app.active].grades)}${input('interviewDate','首面日期','date')}${input('school','就读学校','text','学校全称')}${input('class','班级 / 班型','text','普通班、实验班、贯通班等')}${input('teacher','负责教务 / 访谈人')}${input('region','升学地区 / 报考地区','text','省、市 / 区县')}${select('contact','主要沟通人',['父亲','母亲','父母双方','其他监护人'])}${input('studentWish','学生本人目标 / 意愿')}${input('interest','兴趣与长期投入')}${input('outside','当前校外学习','text','学科、每周频次、学习内容')}${input('budget','家庭教育时间 / 预算投入')}${app.active==='high'?input('electives','选科组合','text','按实际填报科目及赋分口径填写'):''}${area('concern','家长最关注的问题','希望本次首面优先解决什么？')}${area('studentVoice','学生的原话与当前感受','记录动机、压力、睡眠、希望得到的帮助；不以一次面谈作心理诊断')}</div>`}

]:['普通中考升学','指标到校 / 校额等（待核验）','贯通 / 拔尖项目（待核验）','艺体特长（待核验）','国际课程方向','暂未明确'])+input('nearGoal','未来1—2年 / 本学期目标'):area('tierReason','三级目标制定依据','写明理想、正常、保底目标对应的同省同年位次区间、专业约束与数据来源；不可只凭学校名判断')}</div>`}

function scoreTable(){const st=app.active;return `<div class="table-wrap"><table class="scorebook"><thead><tr><th>学科 / 计入</th><th>当前分</th><th>满分</th><th>目标分</th><th>目标差距</th><th>可回收分*</th><th>定位</th><th>主问题层级</th><th>证据 / 口径</th></tr></thead><tbody>${STAGES[st].subjects.map((s,i)=>`<tr><td><label class="small-label"><input type="checkbox" data-include="${i}" aria-label="计入${s}分数账" ${f('include'+i)==='0'?'':'checked'}> 计入</label>${st==='high'&&i>2?`<input aria-label="${s}名称" data-field="subjectName${i}" value="${esc(f('subjectName'+i)||s)}">`:s}</td>${['now','max','target'].map(k=>`<td><input aria-label="${s}${({now:'当前分',max:'满分',target:'目标分'})[k]}" data-field="${k}${i}" type="number" min="0" step="any" value="${esc(f(k+i))}"></td>`).join('')}<td id="gap${i}">—</td><td><input aria-label="${s}可回收分" type="number" min="0" step="any" data-field="recover${i}" value="${esc(f('recover'+i))}"></td><td><select aria-label="${s}定位" data-field="position${i}"><option value="">待判断</option>${['优势','稳定','短板'].map(o=>`<option ${f('position'+i)===o?'selected':''}>${o}</option>`).join('')}</select></td><td><select aria-label="${s}主问题层级" data-field="cause${i}"><option value="">待判断</option>${MODULES.map(m=>`<option value="${m.id}" ${f('cause'+i)===m.id?'selected':''}>${m.name}</option>`).join('')}</select></td><td><input aria-label="${s}成绩证据" data-field="subjectEvidence${i}" value="${esc(f('subjectEvidence'+i))}" placeholder="试卷、日期、失分归因"></td></tr>`).join('')}</tbody></table></div><p class="note">未参加本次考试 / 未开设的学科可取消“计入”，小计只汇总已勾选学科。* 可回收分由教务依据试卷估计，是当前分数中可改善失分的判断，不等同于目标差距；不得超过满分与当前分之差。分数须统一原始分 / 赋分、考试和满分口径。</p><div id="scoreAccount" class="hint"></div>`}
function ratingModule(m){return `<details class="module" open><summary><span><span class="module-title">${m.name}</span> <span class="small-label"> / ${m.brief}</span></span><span class="module-summary" id="summary-${m.id}"></span></summary>${m.items.map((it,i)=>{const id=m.id+'_'+i;return `<div class="rating-item"><div class="rating-top"><label class="rating-name" id="label-${id}">${i+1}. ${it[0]}</label><div class="rate-buttons" role="group" aria-labelledby="label-${id}">${[1,2,3,4,5].map(n=>`<button type="button" data-score="${id}" data-value="${n}" aria-pressed="${current().scores[id]===n}" title="${n}分：${n===1?esc(it[1]):n===3?esc(it[2]):n===5?esc(it[3]):n===2?'介于1分与3分之间，尚不能独立稳定完成':'明显超过3分，大多数情境能独立完成'}" class="${current().scores[id]===n?'selected':''}">${n}</button>`).join('')}<button type="button" class="clear" data-clear="${id}" title="清除本项评分">待评</button></div></div><div class="anchors"><div><b>1 分</b>${it[1]}</div><div><b>3 分</b>${it[2]}</div><div><b>5 分</b>${it[3]}</div></div><input class="evidence" aria-label="${m.name}·${it[0]}的证据" data-evidence="${id}" value="${esc(current().evidence[id]||'')}" placeholder="证据：最近的试卷 / 作业 / 具体行为、时间与频次"></div>`}).join('')}<div class="module-bottom"><div class="fields">${select('space_'+m.id,'阶段可改善空间（影响候选排序）',['较大：证据明确，资源到位','中等：可干预，需持续支持','有限：周期 / 资源存在限制'])}${input('support_'+m.id,'改善空间的判断依据','text','如每周可投入时间、学生配合度、试卷可回收分')}</div></div></details>`}
function potentialForm(){return `<div class="subhead">小学专项 · 高潜特征与发展类型</div><p class="note">按年龄与已有学习机会观察；高潜特征用于安排发展性观察，不是智力鉴定，也不构成特殊招生资格。</p>${POTENTIAL.map(it=>`<div class="rating-item"><div class="rating-top"><b id="label-p-${it[0]}">${it[1]}</b><div class="rate-buttons" role="group" aria-labelledby="label-p-${it[0]}">${[1,2,3,4,5].map(n=>`<button data-potential="${it[0]}" data-value="${n}" class="${current().potential[it[0]]===n?'selected':''}" aria-pressed="${current().potential[it[0]]===n}">${n}</button>`).join('')}<button class="clear" data-pclear="${it[0]}">待评</button></div></div><div class="anchors"><div><b>1分</b>${it[2]}</div><div><b>3分</b>${it[3]}</div><div><b>5分</b>${it[4]}</div></div><input class="evidence" aria-label="${it[1]}观察证据" data-pevidence="${it[0]}" value="${esc(current().potentialEvidence[it[0]]||'')}" placeholder="记录跨时间 / 跨场景观察、作品或具体事例"></div>`).join('')}<div class="fields" style="margin-top:16px">${select('potentialSource','高潜观察证据范围',['仅本次面谈 / 单一描述','两个及以上场景或时点的具体证据'])}${select('devConfirm','教务确认的发展类型',['基础稳定型','优秀学业型','单科突出型','高潜特征待验证','暂时无法判断'])}${area('devReason','发展类型确认依据 / 下一步观察')}</div><div class="hint" id="potentialResult"></div>`}
function diagnosisForm(){return `<div class="fields">${input('examName','成绩依据：考试 / 日期 / 口径','text','近三次同口径大考，原始分或赋分')}${input('recentRanks','最近三次位次与总分区间')}${input('natural','当前自然出口（教务据证填写）','text',app.active==='high'?'参考学校出口与同口径位次，非录取预测':'当前轨迹下的初中 / 高中出口')}${input('naturalSource','自然出口判断依据','text','数据年份、地区、学校、同位次样本')}${select('gapStatus','自然出口与正常目标关系',['高于正常目标','基本匹配','略低于正常目标','明显低于正常目标','信息不足'])}${input('remaining','距关键考试 / 转段时间','text','如6个月、1年；影响训练周期')}${area('gapNotes','目标差距与三个核心问题','最多保留3项，分别写证据；避免只写“粗心”“不认真”')}</div><div class="subhead">${app.active==='high'?'高中分数账 · 从当前成绩到目标成绩':'学科表现与可改善空间'}</div>${scoreTable()}<div class="subhead">五大模块 · 行为锚定评分</div><div class="hint">先找最近一个月的事实，再评分。1分＝尚未建立，3分＝常规可用，5分＝稳定迁移；2分和4分取相邻锚点之间。无证据保留“待评”。小学按年龄与已学内容评价，不与高中同标比较。</div><div id="liveMetrics" class="live-metrics"></div>${MODULES.map(ratingModule).join('')}${app.active==='primary'?potentialForm():''}`}
function planningForm(){return `<div id="insights"></div><details class="help-details"><summary>查看自动判断规则与适用边界</summary><p>模块均分只计算已评项目；缺项显示“暂定”，完整评分后才用于正式候选排序。均分区间：低于2为严重短板，2至不足3为明显薄弱，3至不足3.8为基本达标，3.8至不足4.5为较强，4.5起为明显优势；任何1—2分单项始终单列。</p><p>候选优先指数（仅用于本次排序）：目标缺口×2 + 低于2.5的严重程度×1.2 + 前置层级影响 + 可改善空间权重 + 已记录可回收分权重 + 同模块低分单项权重。巩固 / 提升 / 拔高的参考目标线为3.2 / 3.8 / 4.3；它们是规划启发式，不是统计常模。大学理想层次只在需求未选时辅助推定，当前学段需求选择优先。</p><p>基础或框架不足3.5时，思维突破列为后置候选；基础较弱会提升基础前置权重，学习管理不足3时考虑其执行影响。可改善空间未评时按中等暂估并提示。可回收分只有在主问题层级已归因且数值有效时参与排序。信息不足不自动补分，候选分数不是成功率。</p><p>根因是需要通过试卷、行为记录与短周期干预验证的假设；教务可结合学生意愿、资源和实际目标调整第一变量，并填写依据。正式打印以本次生成时的最新数据为准。</p></details><div class="subhead">教务确认 · 只聚焦一个第一变量</div><div class="fields">${select('confirmed','确认的第一变量',MODULES.map(m=>m.name))}${input('focusSubject','落到哪一科 / 哪个具体行为','text','如数学：综合题无提示调用')}${input('reviewDate','下次复盘日期','date')}${area('confirmReason','确认或调整的依据','需有行为 / 试卷证据、目标关系和可投入资源；未填时结论保留“候选”')}${input('phaseGoal','本阶段可验证目标','text','如两周内，基础题正确率从75%提升至85%')}${input('owner','执行人与支持分工','text','学生、家长、任课老师、教务分别负责什么')}${input('nextExam','下一次考试总分 / 位次目标')}${area('phaseActions','阶段具体动作（可补充自动建议）','频次、时长、完成产物，最多三项')}${area('keep','需要保持的优势与资源')}${area('defer','暂不优先处理的问题及原因')}${area('parentNote','给家长的沟通补充','记录共同约定、观察重点与学生意愿')}</div>`}
function render(){const st=STAGES[app.active];$('pageTitle').textContent=st.label+'学生首面规划';$('stageSubtitle').textContent=st.subtitle;['stageTabs','mobileStageTabs'].forEach(id=>$(id).innerHTML=Object.entries(STAGES).map(([k,v])=>`<button data-stage="${k}" class="${app.active===k?'active':''}" aria-pressed="${app.active===k}">${v.label}</button>`).join(''));$('formRoot').innerHTML=section('basic','01','基本情况','了解学生本人、家庭诉求与已有投入',basicForm())+section('goals','02','升学目标梳理','长期愿景 → 当前阶段 → 主路径与备选',goalsForm())+section('school','03','当前学校情况梳理','把教学环境与升学资源纳入判断',schoolForm())+section('diagnosis','04','学习问题诊断','先记录表现与证据，再判断问题所在层级',diagnosisForm())+section('planning','05','诊断与阶段规划','规则给出候选，教务结合证据作最终确认',planningForm())+`<section id="result"><div class="footer-actions no-print"><div><h2 style="font-size:18px;margin:0">家长版规划结论</h2><p>自动整理目标、诊断、第一变量与下一步约定。</p></div><button class="primary" id="generateBottom">生成 / 更新家长版结论 ↗</button></div><div class="no-print" style="margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><label>打印内容 <select id="printMode" style="width:auto"><option value="report">家长版结论</option><option value="full">结论 + 完整首面记录</option></select></label><button id="copyReport">复制结论文字</button><span class="note">A4 纵向 · 可在打印窗口选择“另存为 PDF”</span></div><div id="reportRoot"></div></section>`;updateLive();if(current().reportGenerated)renderReport();else $('reportRoot').innerHTML='<div class="empty-report no-print">完成访谈后，点击“生成家长版结论”。<br><span class="small-label">未完成的信息会明确标为待补充，不自动作确定性判断。</span></div>';if(!storageAvailable){$('saveStatus').textContent='保存需检查 · 请导出备份';$('mobileSave').textContent='自动保存状态异常，请导出备份。'}}
function stats(){return MODULES.map(m=>{const vals=m.items.map((_,i)=>current().scores[m.id+'_'+i]);const filled=vals.filter(n=>n>=1&&n<=5);return {...m,values:vals,count:filled.length,complete:filled.length===m.items.length,avg:filled.length?filled.reduce((a,b)=>a+b,0)/filled.length:null,lows:vals.map((n,i)=>({n,i,name:m.items[i][0]})).filter(v=>v.n&&v.n<=2),evidenceCount:vals.filter((n,i)=>n&&String(current().evidence[m.id+'_'+i]||'').trim()).length}})}
function band(a){return a===null?'待评':a<2?'严重短板':a<3?'明显薄弱':a<3.8?'基本达标':a<4.5?'较强':'明显优势'}
const interpretation={base:['基础体系尚未建立，先恢复基本得分能力','基础已限制后续学习，优先补概念与方法','基础基本够用，定点修补局部漏洞','基础较稳定，减少无针对性的重复训练','基础形成优势，维护并向综合应用转化'],frame:['尚未建立学科体系，先做结构梳理','知识较零散，优先建立知识地图与调用机制','已有基本框架，继续打通知识关联','学科结构较清楚，可逐步增加综合应用','框架形成优势，可支持更复杂的整合学习'],think:['高阶思维表现尚未建立，先核查前置能力','依赖熟悉题型，需逐步练变式与分析过程','常规任务可完成，陌生迁移仍有提升空间','高阶分析较好，继续做高质量迁移','具备明显思维优势，应保护探索时间'],stable:['考试执行有显著困难，需核对能力与成绩损耗','能力到成绩之间存在明显损耗','常规考试基本稳定，重要考试仍需流程支持','已有能力能较稳定地转成成绩','考试执行形成优势，继续保持复盘'],manage:['学习管理成为底层限制，需要建立可执行的支持系统','学习依赖外部推动，先训练计划与执行','能完成任务，仍需外部结构和复盘支持','自主学习较稳定，逐步转向目标管理','形成自主学习优势，可增加自主决策空间']};
function explain(m){if(m.avg===null)return '尚无评分，不能判断。';const idx=m.avg<2?0:m.avg<3?1:m.avg<3.8?2:m.avg<4.5?3:4;return interpretation[m.id][idx]+(m.lows.length?'；均分下仍有低分单项，需单独处理。':'。')+(!m.complete?' 评分未齐，此结论暂定。':'')}
function demand(){if(f('goalDemand').includes('巩固'))return {target:3.2,label:'巩固达标',source:'当前阶段需求'};if(f('goalDemand').includes('稳步'))return {target:3.8,label:'稳步提升',source:'当前阶段需求'};if(f('goalDemand').includes('拔高'))return {target:4.3,label:'拔高突破',source:'当前阶段需求'};if(['清北','顶尖985','其他985'].includes(f('idealLevel')))return {target:4.3,label:'拔高突破',source:'由家庭理想大学层次暂估，请确认阶段需求'};return {target:3.8,label:'稳步提升',source:'需求未填，按中等需求暂估'}}
function scoreAccount(){let n=0,t=0,r=0,nc=0,tc=0,rc=0;const invalid=[],rows=[];STAGES[app.active].subjects.forEach((s,i)=>{if(f('include'+i)==='0')return;const a=num(f('now'+i)),b=num(f('target'+i)),c=num(f('max'+i)),d=num(f('recover'+i));const name=f('subjectName'+i)||s;const bad=[a,b,c,d].some(v=>v!==null&&v<0)||(c!==null&&((a!==null&&a>c)||(b!==null&&b>c)))||(d!==null&&c!==null&&a!==null&&d>c-a);if(bad)invalid.push(name);const gap=a!==null&&b!==null&&!bad?b-a:null;rows.push({i,name,now:a,target:b,max:c,recover:d,gap,cause:f('cause'+i),bad});if(!bad){if(a!==null){n+=a;nc++}if(b!==null){t+=b;tc++}if(d!==null){r+=d;rc++}}});return {n,t,r,nc,tc,rc,invalid,rows,all:rows.length>0&&rows.every(v=>v.now!==null&&v.target!==null&&v.max!==null&&!v.bad)}}
function rankCandidates(ms){const D=demand(),by=Object.fromEntries(ms.map(m=>[m.id,m]));const account=scoreAccount();const rec=Object.fromEntries(MODULES.map(m=>[m.id,0]));account.rows.forEach(row=>{if(!row.bad&&row.now!==null&&row.max!==null&&row.recover!==null&&rec[row.cause]!==undefined)rec[row.cause]+=row.recover});const recTotal=Object.values(rec).reduce((a,b)=>a+b,0);return ms.filter(m=>m.complete).map(m=>{let prereq=0;const notes=[];let blocked=false;const gap=Math.max(0,D.target-m.avg);if(m.id==='base'&&m.avg<3.5){prereq+=1.6;notes.push('基础是后续框架与思维的前置条件')}if(m.id==='frame'&&m.avg<3.5){if(by.base.complete&&by.base.avg>=3.5){prereq+=1.3;notes.push('基础较好而知识调用偏弱，框架更值得优先核查')}else{prereq+=.3;notes.push('需与基础漏洞区分，避免把前置问题归成框架问题')}}if(m.id==='manage'&&m.avg<3){prereq+=1.4;notes.push('执行不足可能削弱其他训练的落实')}if(m.id==='stable'&&m.avg<3&&by.base.complete&&by.base.avg>=3.5){prereq+=1.2;notes.push('基础较好但考试损耗明显，可优先验证执行流程')}if(m.id==='think'&&(!by.base.complete||!by.frame.complete||by.base.avg<3.5||by.frame.avg<3.5)){blocked=true;notes.push('前置基础 / 框架未达3.5或未评齐，列为后置候选')}const sp=f('space_'+m.id),space=sp.startsWith('较大')?1.2:sp.startsWith('有限')?.15:.65;const serious=Math.max(0,2.5-m.avg)*1.2;const lowWeight=Math.min(.8,m.lows.length*.2);const recovery=recTotal?1.2*rec[m.id]/recTotal:0;const value=gap*2+serious+prereq+space+lowWeight+recovery;notes.push('目标参考线'+D.target.toFixed(1)+'，模块差距'+gap.toFixed(2));notes.push(sp?'改善空间：'+sp:'改善空间未评，暂按中等');if(rec[m.id])notes.push('已归因的可回收分 '+rec[m.id].toFixed(1));if(m.lows.length)notes.push(m.lows.length+'个1—2分单项');return {...m,value,notes,blocked,spaceUnknown:!sp}}).filter(m=>m.avg<D.target||m.lows.length).sort((a,b)=>Number(a.blocked)-Number(b.blocked)||b.value-a.value)}
function rootHypothesis(ms){const b=Object.fromEntries(ms.map(m=>[m.id,m]));const ready=m=>m.complete;let lines=[];if(!ms.every(ready))lines.push('五大模块尚未评齐，当前不确认根因，仅保留以下核查假设。');if(b.base.complete&&b.base.avg<3)lines.push('基础可能是上游限制：先用概念讲解、基础短测和延时复测，区分未理解、遗忘与方法不熟，再看框架表现是否随之改善。');if(b.base.complete&&b.frame.complete&&b.base.avg>=3.5&&b.frame.avg<3)lines.push('基础较好而框架偏弱，优先假设问题在知识组织与主动调用；用同考点单题和综合题的独立表现交叉验证。');if(b.think.complete&&b.base.complete&&b.frame.complete&&b.think.avg<3.5&&b.base.avg>=3.5&&b.frame.avg>=3.5)lines.push('基础、框架已达前置参考线，思维表现偏弱可能是高阶瓶颈；用陌生题口述分析和迁移任务验证。');if(b.stable.complete&&b.base.complete&&b.stable.avg<3&&b.base.avg>=3.5)lines.push('存在能力向考试成绩转化的损耗假设；对照不限时完成与限时测试，核算审题、规范、时间和取舍失分。');if(b.manage.complete&&b.manage.avg<3)lines.push('学习管理可能放大其他问题：先记录一周计划执行、独立启动与错题回炉，验证是否属于“知道但未落实”。');if(lines.length===0||(lines.length===1&&!ms.every(ready)))lines.push('尚无足够的组合证据支持单一根因。需结合目标差距、具体低分单项和试卷失分，做一到两周验证。');return lines}
function potentialConclusion(){const v=POTENTIAL.map(x=>current().potential[x[0]]);const full=v.every(x=>x>=1&&x<=5);const ms=stats();const clues=POTENTIAL.filter(x=>current().potential[x[0]]>=4).map(x=>x[1]);const evidence=POTENTIAL.filter(x=>current().potential[x[0]]>=4&&String(current().potentialEvidence[x[0]]||'').trim()).length;let type='暂时无法判断';let reason='专项观察或核心模块未完成，先补充证据。';if(full){if(clues.length>=3){type='高潜特征待验证';reason='较高特征包括'+clues.join('、')+'。'+(f('potentialSource').startsWith('两个')&&evidence>=3?'已记录多场景线索，可安排持续探究与作品任务继续验证。':'跨时间、跨场景证据尚不足，不能仅凭一次面谈认定高潜。')}else if(STAGES.primary.subjects.some((s,i)=>f('position'+i)==='优势')){type='单科突出型线索';reason='存在教务标记的优势学科，应核对作品与同口径表现，兼顾其他基础。'}else if(ms.every(m=>m.complete&&m.avg>=3.8)){type='优秀学业型线索';reason='五大模块均较稳定，可在保留兴趣和休息的前提下适度增加挑战。'}else if(ms[0].complete&&ms[0].avg>=3){type='基础稳定型线索';reason='基础基本可用，优先建立阅读、表达、习惯和兴趣投入。'}else{reason='尚未形成稳定的类型证据，先关注基本学习体验与可改善项。'}}return {type,reason,confirmed:f('devConfirm'),confirmReason:f('devReason')}}
function gaps(ms){const list=[];if(!f('name').trim())list.push('学生姓名');if(!f('grade'))list.push('年级');if(!f('interviewDate'))list.push('首面日期');if(!f('goalDemand'))list.push('当前阶段目标需求');if(!f('normalUni')&&!f('normalLevel')&&app.active==='high')list.push('正常目标出口');if(!f('normalSchool')&&app.active!=='high')list.push('正常目标学校');ms.forEach(m=>{if(!m.complete)list.push(m.name+'评分'+m.count+'/'+m.items.length);const missing=m.count-m.evidenceCount;if(missing>0)list.push(m.name+'有'+missing+'项缺评分证据')});if(!f('natural')||!f('naturalSource'))list.push('自然出口及依据');if(!f('reviewDate'))list.push('复盘日期');return list}
function updateLive(){const ms=stats();const total=MODULES.reduce((a,b)=>a+b.items.length,0),count=ms.reduce((a,b)=>a+b.count,0);$('progressText').textContent='评分完成 '+count+' / '+total;$('progressBar').style.width=count/total*100+'%';$('liveMetrics').innerHTML=metricsHTML(ms);ms.forEach(m=>$('summary-'+m.id).textContent=(m.avg===null?'待评':m.avg.toFixed(2)+' / 5')+' · '+m.count+'/'+m.items.length+(m.complete?'':' 暂定'));const ac=scoreAccount();STAGES[app.active].subjects.forEach((_,i)=>{if($('gap'+i))$('gap'+i).textContent='未计入'});ac.rows.forEach(r=>{if($('gap'+r.i))$('gap'+r.i).textContent=r.bad?'请核对':r.gap===null?'—':(r.gap>0?'+':'')+r.gap.toFixed(1)});$('scoreAccount').textContent=ac.invalid.length?'请核对 '+ac.invalid.join('、')+'：不得为负数，当前分与目标分不得超满分，可回收分不得超剩余失分。':`已录当前分小计 ${ac.n.toFixed(1)}（${ac.nc}/${ac.rows.length}科）；目标分小计 ${ac.t.toFixed(1)}（${ac.tc}/${ac.rows.length}科）；可回收分小计 ${ac.r.toFixed(1)}。`+(ac.all?'总分目标差距 '+(ac.t-ac.n).toFixed(1)+' 分。':'尚非完整同口径分数账，不计算整体目标差距。');$('insights').innerHTML=insightsHTML(ms);if($('potentialResult')){const p=potentialConclusion();$('potentialResult').textContent='自动观察方向：'+p.type+'。'+p.reason}if(current().reportGenerated)renderReport()}
function metricsHTML(ms){return ms.map(m=>`<div class="metric ${m.avg!==null&&m.avg<3?'low':''}"><span>${m.name}</span><b>${m.avg===null?'—':m.avg.toFixed(2)}</b><span>${band(m.avg)}${m.complete?'':' · 暂定'}</span></div>`).join('')}
function insightsHTML(ms){const strengths=ms.flatMap(m=>m.values.map((n,i)=>n>=4?m.name+'·'+m.items[i][0]+'（'+n+'分）':null).filter(Boolean));const lows=ms.flatMap(m=>m.lows.map(x=>m.name+'·'+x.name+'（'+x.n+'分）'));const ranks=rankCandidates(ms);return `<div class="summary-grid"><div class="insight"><h3>优势项 · 保持与转化</h3><p>${esc(strengths.length?strengths.join('、'):'尚无已评4—5分项目；先收集具体表现。')}</p></div><div class="insight"><h3>核心短板 · 不让均分掩盖低项</h3><p>${esc(lows.length?lows.join('、'):'尚无已评1—2分单项；仍需核查目标需求与未评项目。')}</p></div><div class="insight" style="grid-column:1/-1"><h3>根因判断 · 需验证的假设</h3><ul>${rootHypothesis(ms).map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></div></div><div class="subhead">第一变量候选 · 需求参考线 ${demand().target.toFixed(1)} / 5</div><p class="note">依据：${esc(demand().source)}。候选需模块评齐；全模块与证据未齐前为暂定排序。</p>${ranks.length?ranks.slice(0,3).map((m,i)=>`<div class="candidate"><span class="candidate-num">${i+1}</span><div><strong>${m.name}${m.blocked?' · 后置候选':''} <span class="small-label">排序指数 ${m.value.toFixed(2)}</span></strong><p>${esc(m.notes.join('；'))}</p><p>建议：${esc(m.action)}</p></div></div>`).join(''):'<div class="hint">暂无可排序候选：模块未评齐，或已评齐模块达到当前目标参考线且无1—2分项。可针对具体目标与证据设置巩固任务。</div>'}`}
function chosenVariable(ms){const confirmed=MODULES.find(m=>m.name===f('confirmed'));if(confirmed&&f('confirmReason').trim()&&ms.find(m=>m.id===confirmed.id).complete)return {m:confirmed,confirmed:true,reason:f('confirmReason')};const candidates=rankCandidates(ms);const top=candidates.find(m=>!m.blocked);return {m:top||null,confirmed:false,reason:top?top.notes.join('；'):'暂不确定第一变量，先补齐评分与目标证据。'}}

庭大学长期期待</th></tr></thead><tbody>${[['理想 / 冲刺','ideal'],['正常 / 合理努力','normal'],['保底 / 最低可接受','floor']].map(([label,k])=>`<tr><td>${label}</td><td>${esc(app.active==='high'?([f(k+'Level'),f(k+'Uni')].filter(Boolean).join(' · ')||'待明确'):(f(k+'School')||'待明确'))}</td><td>${esc([f(k+'Level'),f(k+'Uni')].filter(Boolean).join(' · ')||'待讨论')}</td></tr>`).join('')}</tbody></table><p>专业方向：${esc([arr('majors').join('、'),f('majorSpecific')].filter(Boolean).join('；')||'待探索')}。地域偏好：${esc(f('cities')||f('regionFlex')||'待讨论')}。选择顺序：${esc(f('priority')||'待共同确认')}。家庭风险偏好：${esc(f('risk')||'待共同确认')}。</p><p>关注路径：${esc(path)}。主路径：${esc(f('pathMain')||f('schoolPath')||'待核验后确定')}；备选：${esc(f('pathBackup')||'待讨论')}。资格与政策核验：${esc(f('pathEvidence')||'待补充当年当地资料')}。</p>${f('constraints')?'<p>家庭限制与共同决策事项：'+esc(f('constraints'))+'</p>':''}<h3>二、孩子现在的位置与学校环境</h3><p>当前自然出口：<b>${esc(f('natural')||'暂不判断，先收集同口径成绩与出口资料')}</b>；依据：${esc(f('naturalSource')||'尚未补充')}。与正常目标关系：${esc(f('gapStatus')||'信息不足')}。</p><p>学校资源匹配：${esc(f('match')||'待了解')}；主要优势：${esc(f('resourcePlus')||'待补充')}；主要限制：${esc(f('resourceLimit')||'待补充')}。当前位次：${esc(f('rank')||'待补充')}${f('cohort')?' / '+esc(f('cohort')):'（年级总人数待补充）'}。${f('recentRanks')?'近期变化：'+esc(f('recentRanks'))+'。':''}</p>${f('gapNotes')?'<p>本次核查的核心差距：'+esc(f('gapNotes'))+'</p>':''}<h3>三、五大能力模块与关键发现</h3><div class="live-metrics">${metricsHTML(ms)}</div><table><thead><tr><th style="width:18%">模块</th><th>当前判断</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${m.name}<br>${m.count}/${m.items.length}项</td><td>${esc(explain(m))}</td></tr>`).join('')}</tbody></table><p><b>值得保持的优势：</b>${esc(strengths.join('、')||'尚无足够的高分表现证据，继续观察孩子能独立做好的事情。')}</p><p><b>优先核查的短板：</b>${esc(low.join('、')||'暂无已评1—2分单项；继续结合目标要求看提升空间。')}</p><p><b>可能的原因：</b>${esc(rootHypothesis(ms).join(' '))} 这是本次首面的工作假设，后续用具体学习记录验证。</p>${p?`<h3>四、小学专项：发展类型与高潜线索</h3><p>自动观察方向：${esc(p.type)}。${esc(p.reason)}</p><p>教务判断：${esc(p.confirmed||'暂未确认')}；依据与后续观察：${esc(p.confirmReason||'待补充')}。不凭一次评分给学生固定贴标签。</p>`:''}<h3>${p?'五':'四'}、接下来最值得聚焦的一件事</h3><div class="report-callout"><b>${ch.m?(ch.confirmed?'已由教务确认：':'建议优先验证的候选：')+esc(ch.m.name)+(f('focusSubject')?' · '+esc(f('focusSubject')):''):'第一变量待确定'}</b><p style="margin-bottom:0">${esc(ch.reason)}</p></div>${f('confirmed')&&!ch.confirmed?'<p>教务选择了第一变量，但评分或确认依据不完整，目前仍按自动候选展示，需补齐后确认。</p>':''}<p>本阶段可验证目标：${esc(f('phaseGoal')||'待教务结合基线记录，与学生共同制定')}。下一次考试目标：${esc(f('nextExam')||'待补充同口径总分 / 位次目标')}。距关键考试：${esc(f('remaining')||'待确认')}。</p><ol><li><b>第一周：建立基线。</b>${ch.m?'收集'+esc(ch.m.name)+'相关试卷或任务记录，定位最具体的一个行为。':'补齐目标、评分证据与当前同口径表现，确定一个可验证的问题。'}</li><li><b>第2—3周：执行专项动作。</b>${esc(ch.m?ch.m.action:'围绕已确认的问题设置少量、可持续的任务；先不扩大训练范围。')}</li><li><b>第4周 / 下一次复盘：核对变化。</b>${esc(ch.m?'比较'+ch.m.metric+'；使用相近难度任务检验，不只看一次总分。':'复核评分、行为变化与目标适配程度，再确定下一阶段。')}</li></ol>${f('phaseActions')?'<p>本次共同约定的具体动作：'+esc(f('phaseActions'))+'</p>':''}<p>执行与支持分工：${esc(f('owner')||'待明确学生、家长、老师和教务的分工')}。保持的优势：${esc(f('keep')||'保留已出现的优势表现与适度兴趣投入')}。暂不优先处理：${esc(f('defer')||'待结合第一变量和时间预算确认')}。</p>${app.active==='high'||ac.nc?`<h3>${p?'六':'五'}、${app.active==='high'?'分数账与复盘':'学科记录与复盘'}</h3><p>成绩依据：${esc(f('examName')||'待补充同口径考试来源')}。${ac.invalid.length?'部分分数无效，请核对：'+esc(ac.invalid.join('、'))+'。':ac.all?'当前合计 '+ac.n.toFixed(1)+'；目标合计 '+ac.t.toFixed(1)+'；目标差距 '+(ac.t-ac.n).toFixed(1)+' 分。':'分数账尚未齐全；当前已录小计 '+ac.n.toFixed(1)+'（'+ac.nc+'/'+ac.rows.length+'科），不能据此判断整体提分差距。'} 可回收分估计小计 ${ac.r.toFixed(1)}，需试卷证据支持。</p><table><thead><tr><th>学科</th><th>当前 / 满分</th><th>目标 / 差距</th><th>可回收分</th><th>问题层级</th></tr></thead><tbody>${ac.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.bad?'需核对':(r.now??'—')+' / '+(r.max??'—')}</td><td>${r.bad?'需核对':(r.target??'—')+' / '+(r.gap===null?'—':r.gap.toFixed(1))}</td><td>${r.bad?'需核对':r.recover??'—'}</td><td>${esc(MODULES.find(m=>m.id===r.cause)?.name||'待归因')}</td></tr>`).join('')}</tbody></table>`:''}<h3>共同约定与下一次复盘</h3><p>下次复盘：<b>${esc(f('reviewDate')||'日期待约定')}</b>。重点看第一变量是否改善、具体动作是否完成、同口径位次与自然出口是否需要调整。</p>${f('studentVoice')?'<p>学生本人的声音：'+esc(f('studentVoice'))+'</p>':''}${f('parentNote')?'<p>与家长的补充约定：'+esc(f('parentNote'))+'</p>':''}<div class="report-footer">本记录依据首面与已提供资料形成，能力分数用于组织观察与行动，不是标准化测评或录取概率。自然出口由教务据证填写，路径资格、招生要求与位次资料须按当年当地信息核验。${ch.confirmed?'本次第一变量已有教务确认。':'当前第一变量仍为待验证候选。'}</div></article>`}
function generate(scroll=true){current().reportGenerated=true;renderReport();save();if(scroll)$('result').scrollIntoView({behavior:'smooth',block:'start'});toast('已按当前记录生成；缺失信息已在结论中提示')}
function buildPrintSnapshot(){const sections=[...document.querySelectorAll('.editor')];$('printSnapshot').innerHTML='<h2>完整首面记录 · '+esc(STAGES[app.active].label)+'</h2><p>评分锚点见原网页。以下是本次填写值与具体证据。</p>'+sections.map(section=>{let fields=[...section.querySelectorAll('[data-field]')].filter(el=>!el.closest('table')).map(el=>{const label=el.closest('.field')?.querySelector('span')?.textContent||el.getAttribute('aria-label')||el.dataset.field;return '<div class="snapshot-field"><b>'+esc(label)+'：</b>'+esc(el.value||'未填写')+'</div>'}).join('');const choiceKeys=[...new Set([...section.querySelectorAll('[data-check]')].map(e=>e.dataset.check))];fields+=choiceKeys.map(k=>'<div class="snapshot-field"><b>'+esc(section.querySelector(`[data-check="${k}"]`).closest('.field').querySelector('span').textContent)+'：</b>'+esc(arr(k).join('、')||'未选择')+'</div>').join('');if(section.id==='diagnosis'){const ac=scoreAccount();fields+='<h3>学科记录</h3><table><thead><tr><th>学科</th><th>分数账</th><th>定位 / 层级</th><th>证据</th></tr></thead><tbody>'+ac.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>当前 '+(r.now??'—')+' / 满分 '+(r.max??'—')+'；目标 '+(r.target??'—')+'；可回收 '+(r.recover??'—')+(r.bad?'（需核对）':'')+'</td><td>'+esc(f('position'+r.i)||'待判断')+' / '+esc(MODULES.find(m=>m.id===r.cause)?.name||'待判断')+'</td><td>'+esc(f('subjectEvidence'+r.i)||'未填写')+'</td></tr>').join('')+'</tbody></table>';fields+='<h3>行为评分与证据</h3><table><thead><tr><th>模块 / 评分项</th><th style="width:12%">评分</th><th>具体证据</th></tr></thead><tbody>'+MODULES.flatMap(m=>m.items.map((it,i)=>'<tr><td>'+m.name+' · '+it[0]+'</td><td>'+(current().scores[m.id+'_'+i]||'待评')+'</td><td>'+esc(current().evidence[m.id+'_'+i]||'未填写')+'</td></tr>')).join('')+'</tbody></table>';if(app.active==='primary')fields+='<h3>高潜特征记录</h3>'+POTENTIAL.map(it=>'<div class="snapshot-field">'+it[1]+'：'+(current().potential[it[0]]||'待评')+'；证据：'+esc(current().potentialEvidence[it[0]]||'未填写')+'</div>').join('')}return '<div class="snapshot-section"><h3>'+esc(section.querySelector('h2').textContent)+'</h3>'+fields+'</div>'}).join('')}
function printReport(){generate(false);buildPrintSnapshot();document.body.classList.toggle('print-full',$('printMode').value==='full');window.print()}
function resetStage(){if(!confirm('清空'+STAGES[app.active].label+'当前首面并开始新学生？请先导出需要保留的数据。其他学段不受影响。'))return;app.stages[app.active]=blank();save();render();window.scrollTo({top:0});toast('当前学段已清空')}
function exportData(){const blob=new Blob([JSON.stringify(app,null,2)],{type:'application/json'});download(blob,'首面规划备份_'+localDate()+'.json');toast('已导出三学段备份，请妥善保存')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function copyReport(){if(!current().reportGenerated)generate(false);const text=$('reportRoot').innerText;try{await navigator.clipboard.writeText(text);toast('已复制家长版结论')}catch(e){download(new Blob([text],{type:'text/plain;charset=utf-8'}),(f('name')||'学生')+'_首面规划结论.txt');toast('浏览器限制剪贴板，已改为下载文字结论')}}
function demo(){if(!confirm('载入示例会覆盖本学段当前记录。请先导出需要保留的数据，是否继续？'))return;const d=blank();d.fields={name:'示例同学',grade:STAGES[app.active].grades[1],interviewDate:localDate(),school:'示例学校',teacher:'示例教务',normalSchool:app.active==='primary'?'适合发展兴趣的优质初中':'目标重点高中',normalLevel:'211 / 双一流',normalUni:'待结合位次确定具体院校',idealLevel:'其他985',goalDemand:'稳步提升 / 重点学校',natural:'与目标相比，综合题表现仍有差距',naturalSource:'示例演示数据，非真实升学判断',reviewDate:localDate(),phaseGoal:'两周内，综合题无提示调用成功率由50%提升至70%',owner:'学生每日记录；老师每周核验；教务两周复盘',pathMain:'普通升学为主，保留其他可能性',paths:['普通高考'],gapStatus:'略低于正常目标'};MODULES.forEach((m,mi)=>{d.fields['space_'+m.id]='中等：可干预，需持续支持';m.items.forEach((it,i)=>{d.scores[m.id+'_'+i]=[4,2,3,4,3][mi];d.evidence[m.id+'_'+i]='示例证据：用于演示规则，实际首面需逐项更换。'})});if(app.active==='primary')POTENTIAL.forEach(it=>{d.potential[it[0]]=3;d.potentialEvidence[it[0]]='示例观察，待实际验证'});app.stages[app.active]=d;save();render();toast('已载入示例，可查看框架优先的判断过程')}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){if(t.type==='number'&&t.validity.badInput)return;current().fields[t.dataset.field]=t.value;save();updateLive()}else if(t.dataset.evidence){current().evidence[t.dataset.evidence]=t.value;save();updateLive()}else if(t.dataset.pevidence){current().potentialEvidence[t.dataset.pevidence]=t.value;save();updateLive()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.include!==undefined){current().fields['include'+t.dataset.include]=t.checked?'1':'0';save();updateLive()}else if(t.dataset.check){const vals=[...document.querySelectorAll(`[data-check="${t.dataset.check}"]:checked`)].map(x=>x.value);current().fields[t.dataset.check]=vals;save();updateLive()}else if(t.dataset.field){current().fields[t.dataset.field]=t.value;save();updateLive()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.stage){app.active=t.dataset.stage;save();render();window.scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.score||t.dataset.potential){const prop=t.dataset.score?'scores':'potential',id=t.dataset.score||t.dataset.potential;current()[prop][id]=Number(t.dataset.value);const container=t.closest('.rate-buttons');container.querySelectorAll('[data-value]').forEach(b=>{const selected=Number(b.dataset.value)===Number(t.dataset.value);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});save();updateLive()}else if(t.dataset.clear||t.dataset.pclear){const prop=t.dataset.clear?'scores':'potential',id=t.dataset.clear||t.dataset.pclear;delete current()[prop][id];t.closest('.rate-buttons').querySelectorAll('[data-value]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});save();updateLive()}else if(['generateTop','generateBottom'].includes(t.id))generate();else if(t.id==='printBtn')printReport();else if(t.id==='resetBtn')resetStage();else if(t.id==='exportBtn')exportData();else if(t.id==='importBtn')$('importFile').click();else if(t.id==='copyReport')copyReport();else if(t.id==='demoBtn')demo()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('文件过大');const p=JSON.parse(await file.text());if(!validBackup(p))throw new Error('不是有效的v1首面备份或评分超范围');if(!confirm('恢复会覆盖当前浏览器的三学段记录，是否继续？'))return;app=p;save();render();toast('三学段备份已恢复')}catch(err){toast('恢复失败：'+err.message)}finally{e.target.value=''}});
window.addEventListener('beforeprint',()=>{if(!current().reportGenerated){current().reportGenerated=true;renderReport()}buildPrintSnapshot();document.body.classList.toggle('print-full',$('printMode')?.value==='full')});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('另一个窗口修改了记录。请先备份当前内容，再刷新同步，避免交叉覆盖。')});
render();if(storageAvailable)$('mobileSave').textContent='本浏览器自动保存已就绪 · 每学段保留一份当前首面';
</script>
</body></html>
