let app={version:1,active:'primary',stages:{primary:blank(),middle:blank(),high:blank()}};
let storageAvailable=true;
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(validBackup(p))app=p;else storageAvailable=false}}catch(e){storageAvailable=false}

const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>app.stages[app.active];const f=k=>current().fields[k]??'';const arr=k=>Array.isArray(f(k))?f(k):[];const num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):null;
function blank(){return {fields:{},scores:{},evidence:{},potential:{},potentialEvidence:{},reportGenerated:false}}
function validBackup(x){return !!(x&&x.version===1&&Object.keys(STAGES).includes(x.active)&&x.stages&&Object.keys(STAGES).every(k=>{const v=x.stages[k];return v&&['fields','scores','evidence','potential','potentialEvidence'].every(t=>v[t]&&typeof v[t]==='object'&&!Array.isArray(v[t]))&&Object.values(v.scores).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.values(v.potential).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.entries(v.fields).every(([k,n])=>['paths','majors'].includes(k)?Array.isArray(n)&&n.every(t=>typeof t==='string'):typeof n==='string')&&Object.values(v.evidence).every(n=>typeof n==='string')&&Object.values(v.potentialEvidence).every(n=>typeof n==='string')}))}
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(app));storageAvailable=true;$('saveStatus').innerHTML='<span class="status-dot"></span>已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('mobileSave').textContent='已保存到本浏览器 · 三学段分别保存一份当前首面'}catch(e){storageAvailable=false;$('saveStatus').textContent='本地保存不可用 · 请导出备份';$('mobileSave').textContent='自动保存不可用，请先导出数据备份。'}}
function input(key,label,type='text',placeholder='',cls=''){return `<label class="field ${cls}"><span>${esc(label)}</span><input data-field="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(f(key))}" placeholder="${esc(placeholder)}"></label>`}
function area(key,label,placeholder='',cls='full'){return `<label class="field ${cls}"><span>${esc(label)}</span><textarea data-field="${key}" placeholder="${esc(placeholder)}">${esc(f(key))}</textarea></label>`}
function checks(key,label,options){return `<div class="field full"><span>${esc(label)}</span><div class="choices">${options.map(o=>`<label class="choice"><input data-check="${key}" type="checkbox" value="${esc(o)}" ${arr(key).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`}
function section(id,no,title,sub,body){return `<section id="${id}" class="card editor"><div class="section-head"><span class="section-no">${no}</span><div><h2>${title}</h2><p>${sub}</p></div></div>${body}</section>`}
function demand(){if(f('goalDemand').includes('巩固'))return {target:3.2,label:'巩固达标',source:'当前阶段需求'};if(f('goalDemand').includes('稳步'))return {target:3.8,label:'稳步提升',source:'当前阶段需求'};if(f('goalDemand').includes('拔高'))return {target:4.3,label:'拔高突破',source:'当前阶段需求'};if(['清北','顶尖985','其他985'].includes(f('idealLevel')))return {target:4.3,label:'拔高突破',source:'由家庭理想大学层次暂估，请确认阶段需求'};return {target:3.8,label:'稳步提升',source:'需求未填，按中等需求暂估'}}
function potentialConclusion(){const v=POTENTIAL.map(x=>current().potential[x[0]]);const full=v.every(x=>x>=1&&x<=5);const ms=stats();const clues=POTENTIAL.filter(x=>current().potential[x[0]]>=4).map(x=>x[1]);const evidence=POTENTIAL.filter(x=>current().potential[x[0]]>=4&&String(current().potentialEvidence[x[0]]||'').trim()).length;let type='暂时无法判断';let reason='专项观察或核心模块未完成，先补充证据。';if(full){if(clues.length>=3){type='高潜特征待验证';reason='较高特征包括'+clues.join('、')+'。'+(f('potentialSource').startsWith('两个')&&evidence>=3?'已记录多场景线索，可安排持续探究与作品任务继续验证。':'跨时间、跨场景证据尚不足，不能仅凭一次面谈认定高潜。')}else if(STAGES.primary.subjects.some((s,i)=>f('position'+i)==='优势')){type='单科突出型线索';reason='存在教务标记的优势学科，应核对作品与同口径表现，兼顾其他基础。'}else if(ms.every(m=>m.complete&&m.avg>=3.8)){type='优秀学业型线索';reason='五大模块均较稳定，可在保留兴趣和休息的前提下适度增加挑战。'}else if(ms[0].complete&&ms[0].avg>=3){type='基础稳定型线索';reason='基础基本可用，优先建立阅读、表达、习惯和兴趣投入。'}else{reason='尚未形成稳定的类型证据，先关注基本学习体验与可改善项。'}}return {type,reason,confirmed:f('devConfirm'),confirmReason:f('devReason')}}

function goalChain(){
 const st=app.active,uni=goalName('normal'),high=st==='primary'?f('futureHighSchool'):st==='middle'?f('normalSchool'):'',middle=st==='primary'?f('normalSchool'):'';
 const nodes=[{label:st==='high'?'大学目标':'大学愿景',value:uni||'暂未确定',detail:f('universityNeed')?'需要的准备：'+f('universityNeed'):'先想清喜欢的方向，再了解课程、选科或升学方式的要求。'}];
 if(st!=='high')nodes.push({label:'高中定位',value:high||'暂未确定',detail:st==='primary'?'先写学校或发展方向，后续结合孩子成长调整。':'高中选择要同时考虑升学准备、课程资源和孩子是否适应。'});
 if(st==='primary')nodes.push({label:'初中定位',value:middle||'暂未确定',detail:'关注日常教学、学习习惯和后续高中准备，结合当地升学方式选择。'});
 const ac=scoreAccount();nodes.push({label:st==='high'?'当前起点':'当前准备',value:st==='high'?(f('natural')||'目前大致能到哪类学校：待了解'):(f('school')||'当前在读学校待填'),detail:[f('rank')?'本次考试年级排名：'+f('rank')+'名':'',st==='high'&&ac.nc?(ac.all?'已填各科总分 '+ac.n.toFixed(1)+'，目标 '+ac.t.toFixed(1):'已填写部分学科分数，不能推算完整总分'):'',f('nearGoal')?'近期希望：'+f('nearGoal'):''].filter(Boolean).join('；')||'结合近期成绩、课堂适应和下面30项学习情况，确定眼前要做的事。'});
 const links=[];
 function bridge(label,from,to,key,need,action){const state=f(key);if(!from||!to){links.push({label,state:'待补目标',text:'两端的目标还没填完整，暂不判断是否衔接。',action});return}if(!state||state==='还没比较过'){links.push({label,state:'待比较',text:need,action});return}if(state.startsWith('基本支持'))links.push({label,state:'初步支持',text:'教务当前判断基本支持。仍需核对'+need,action:'核对后保留这条选择，同时准备可接受的备选。'});else if(state.startsWith('需要额外'))links.push({label,state:'需要补条件',text:need+' 当前判断还需补充条件。',action:f(key+'Action')||action});else links.push({label,state:'需要调整',text:'当前判断不能充分支持下一步目标。'+need,action:f(key+'Action')||action})}
 if(st!=='high')bridge('高中 → 大学',high,uni,'highBridge','目标高中是否能提供'+(f('universityNeed')||'大学方向所需的课程、选科及升学准备')+'。','比较目标高中的课程、选科、支持资源和近年去向；缺少的资源明确由谁补，补不了就调整高中选择或大学方向。');
 if(st==='primary')bridge('初中 → 高中',middle,high,'middleBridge','目标初中的教学、学习习惯培养和后续升学条件，是否有助于准备目标高中。','了解目标高中的入学方式，再比较初中的日常教学与孩子适应情况；把暂时欠缺的阅读、基础和自主学习列入当前准备。');
 if(st==='high'){const gap=f('gapStatus');links.push({label:'当前起点 → 大学',state:!uni||!f('natural')?'待补目标':gap&&gap!=='信息不足'?'已记录差距':'待比较',text:!uni||!f('natural')?'先补大学正常目标与当前大致去向，再比较差距。':gap&&gap!=='信息不足'?'与正常目标相比：'+gap+'。这是根据成绩信息填写的判断，不由能力评分推算。':'还需用同类考试排名、选科和目标要求比较，不能只比不同考试的裸分。',action:f('schoolRequirement')?'已记录目标要求：'+f('schoolRequirement')+'。核对适用地区、年份和选科，再把差距拆到各科。':'把近期同类考试排名与目标学校要求对照，先确定正常目标是否可争取，再补理想和保底选择。'})}
 const ms=stats(),plan=selectedPlan(ms),count=ms.reduce((a,m)=>a+m.count,0);const next=st==='primary'?'初中目标':st==='middle'?'高中目标':'大学目标';
 const prep=[f('schoolRequirement')?'下一站要求：'+f('schoolRequirement'):'下一站还需核对：'+next+'的入学方式、成绩要求及孩子能否适应。'];
 if(f('difficulty')==='偏难'||f('difficulty')==='明显超出当前能力')prep.push('当前校内内容已有跟进困难，先补当下缺口，再安排额外拔高。');
 if(f('match')==='部分不匹配'||f('match')==='明显不匹配')prep.push('校内有些困难缺少针对帮助，需要明确任课老师、家庭或其他资源怎样补上。');
 if(plan&&plan.m.id!=='maintain')prep.push('学习准备先落到：'+plan.title+'。按下方两周安排练习，复查后再调难度。');else if(count===30)prep.push('当前评分较稳定，先保持有效做法，结合目标要求决定是否需要进一步拔高。');else prep.push('学习准备尚需了解：已回答'+count+'/30项；未评分不代表做不到。');

 const tiers=(st==='high'?'':input('idealSchool','理想'+(st==='primary'?'初中':'高中'))+input('floorSchool','最低能接受的'+(st==='primary'?'初中':'高中')))+(st==='primary'?input('futureHighIdeal','理想高中 / 方向')+input('futureHighFloor','最低能接受的高中 / 方向'):'')+select('idealLevel','理想大学层次',LEVELS)+input('idealUni','理想大学 / 方向')+select('floorLevel','最低能接受的大学层次',LEVELS)+input('floorUni','保底大学 / 方向');

function ratingModule(m){const ids=indices(m);return `<div class="simple-module"><div class="simple-module-head"><div><h3>${m.name}</h3><p>${m.brief}</p></div><span id="summary-${m.id}" class="module-summary"></span></div>${ids.map(i=>{const it=m.items[i],id=m.id+'_'+i;return `<div class="rating-item"><div class="rating-top"><b class="rating-name" id="label-${id}">${it[0]}</b><div class="rate-buttons" role="group" aria-labelledby="label-${id}">${[1,2,3,4,5].map(n=>`<button data-score="${id}" data-value="${n}" aria-pressed="${current().scores[id]===n}" class="${current().scores[id]===n?'selected':''}" title="${n}分：${esc(n===1?it[1]:n===3?it[2]:n===5?it[3]:n===2?'比1分好一些，但还没达到3分':'比3分更稳定，还没有达到5分')}">${n}</button>`).join('')}<button class="clear" data-clear="${id}" title="还不了解，暂不评分">不了解</button></div></div><div class="anchors"><div><b>1分</b>${it[1]}</div><div><b>3分</b>${it[2]}</div><div><b>5分</b>${it[3]}</div></div></div>`}).join('')}${fold('近期的练习条件',`<div class="fields">${select('space_'+m.id,'近期有没有条件坚持练？',['较大：证据明确，资源到位','中等：可干预，需持续支持','有限：周期 / 资源存在限制'])}</div>`)}</div>`}
function stats(){return MODULES.map(m=>{const ids=indices(m);const vals=m.items.map((_,i)=>ids.includes(i)?current().scores[m.id+'_'+i]:undefined);const filled=vals.filter(n=>n>=1&&n<=5);return {...m,values:vals,indices:ids,required:ids.length,count:filled.length,complete:filled.length===ids.length,avg:filled.length?filled.reduce((a,b)=>a+b,0)/filled.length:null,lows:vals.map((n,i)=>({n,i,name:m.items[i][0]})).filter(v=>v.n&&v.n<=2),evidenceCount:vals.filter((n,i)=>n&&String(current().evidence[m.id+'_'+i]||'').trim()).length}})}
function metricsHTML(ms){return ms.map(m=>`<div class="metric ${m.avg!==null&&m.avg<3?'low':''}"><span>${m.name}</span><b>${m.avg===null?'—':m.avg.toFixed(1)}</b><span>${m.count}/${m.required}项${m.complete?'':' · 待了解'}</span></div>`).join('')}
function explain(m){if(m.avg===null)return '这方面还没了解，先不下判断。';const low=m.values.map((n,i)=>({n,i})).filter(x=>x.n).sort((a,b)=>a.n-b.n)[0];if(m.lows.length)return '目前要多帮一把，具体先看：'+m.items[low.i][0];const sentences={base:'课本和简单题大多能应对，继续留意反复错的地方。',frame:'能运用学过的内容，继续练习自己说清解题步骤。',think:'能尝试新题，适合在现有基础上逐步增加变化。',stable:'考试时大多能把会的做出来，继续保持检查习惯。',manage:'明确任务后通常能完成，逐步减少催促。'};return m.avg>=4?'这方面目前比较稳定，保持已有做法。':sentences[m.id]}
function gaps(ms){const a=[];if(!f('name').trim())a.push('学生姓名');if(!f('grade'))a.push('年级');ms.forEach(m=>{if(!m.complete)a.push(m.name+'还有'+(m.required-m.count)+'个问题未了解')});return a}

function issueOptions(ms){return ms.flatMap(m=>m.values.map((n,i)=>n?{id:m.id+'_'+i,m,i,n}:null).filter(Boolean))}
function plainReason(m,ms){const b=Object.fromEntries(ms.map(x=>[x.id,x]));if(m.id==='base')return '先把学过的内容和简单题做稳，后面的综合题才更容易跟上。';if(m.id==='frame')return b.base.avg>=3.5?'简单题相对能做，主要卡在“自己找方法、把几步连起来”，先练这一件更有针对性。':'先从把题拆成小步开始，同时检查拆开后的小题是否真的会。';if(m.id==='think')return '基础和常见综合题相对能做，再用小变化的新题练习自己找办法。';if(m.id==='stable')return '先把本来会做的题做出来，看看能否少看漏、少写漏、少留空。';return '其他训练要先做得下去。先把每天约定的小任务落实，才有机会看见变化。'}
function strengthSummaries(ms){const words={base:'课本内容和简单题做得相对稳定，可以保留现在有效的学习做法。',frame:'多数情况下能自己想到方法，把学过的内容连起来用。',think:'题目有所变化时，仍愿意尝试，并能自己想出一些办法。',stable:'会做的题较少因为看漏或来不及而丢分，可以保持已有检查习惯。',manage:'多数约定任务能完成，能做订正和复习，值得继续保持。'};return ms.filter(m=>m.complete&&m.avg>=3.8&&!m.lows.length).map(m=>words[m.id]).slice(0,2)}
function reviewDay(){if(f('reviewDate'))return f('reviewDate');const d=new Date();d.setDate(d.getDate()+14);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

function buildPrintSnapshot(){const ms=stats();const labels=new Map();document.querySelectorAll('[data-field]').forEach(el=>{if(el.dataset.field==='planIssue')return;const label=el.closest('.field')?.querySelector('span')?.textContent||el.getAttribute('aria-label')||el.dataset.field;if(el.value)labels.set(el.dataset.field,{label,value:el.tagName==='SELECT'?(el.options[el.selectedIndex]?.text||el.value):el.value})});$('printSnapshot').innerHTML='<h2>首面填写记录</h2>'+[...labels.values()].map(x=>'<div class="snapshot-field"><b>'+esc(x.label)+'：</b>'+esc(x.value)+'</div>').join('')+['paths','majors'].filter(k=>arr(k).length).map(k=>'<div class="snapshot-field">'+(k==='paths'?'关注的升学方式':'感兴趣的专业')+'：'+esc(arr(k).join('、'))+'</div>').join('')+'<h3>30项学习评分</h3><p>未评项目保持空白，不计为0分。</p>'+ms.map(m=>'<h3>'+m.name+'</h3><table><thead><tr><th>问题</th><th style="width:18%">评分</th></tr></thead><tbody>'+m.indices.map(i=>'<tr><td>'+esc(m.items[i][0])+'</td><td>'+(m.values[i]||'不了解')+'</td></tr>').join('')+'</tbody></table>').join('');if(app.active==='primary'&&Object.keys(current().potential).length)$('printSnapshot').innerHTML+='<h3>小学发展特点</h3>'+POTENTIAL.map(it=>'<div class="snapshot-field">'+it[1]+'：'+(current().potential[it[0]]||'不了解')+'</div>').join('')}
function demo(){if(!confirm('载入示例将替换本学段当前记录。需要保留请先备份。继续吗？'))return;const d=blank();d.fields={name:'示例同学',grade:STAGES[app.active].grades[app.active==='primary'?4:1],school:'示例学校',concern:'常规学习任务能完成，换材料或需要自己安排步骤时容易卡住。',goalDemand:'稳步提升 / 重点学校',normalSchool:app.active==='primary'?'校内教学扎实、注重自主学习的初中':'课程扎实、支持理科兴趣的高中',normalLevel:'其他985',normalUni:'理工类方向（愿景）',universityNeed:'扎实的校内课程和高考准备',futureHighSchool:app.active==='primary'?'课程扎实、支持理科兴趣的高中':'',highBridge:'还没比较过',middleBridge:'还没比较过',nearGoal:'先练自己找方法，再尝试综合题',natural:app.active==='high'?'当前成绩大致对应的大学层次，待结合排名确认':'',interviewDate:localDate()};MODULES.forEach((m,mi)=>m.items.forEach((_,i)=>d.scores[m.id+'_'+i]=[4,2,3,4,3][mi]));app.stages[app.active]=d;save();render();toast('已载入30项示例，可查看目标衔接和具体练法。')}

const FINDINGS={base:['学过的知识仍有缺口','概念解释还不够清楚','基础任务正确率不够稳','学过内容容易遗忘','基本方法使用不熟练'],frame:['知识之间的联系没串起来','判断任务要求还不稳定','独立调用方法不够熟练','多步骤综合运用容易卡住','做完以后缺少规律总结'],think:['任务换个说法就难开始','多条件分析不够清楚','相似任务之间迁移不足','遇到困难后尝试办法少','长材料中的关键信息容易漏','对做法的原因和适用条件想得不够'],stable:['看漏、看错要求造成失误','过程、单位或要点容易漏写','时间安排不够稳定','卡住后及时跳过做得不稳','重要考试时容易乱节奏','相近难度考试表现有起伏'],manage:['近期目标还没变成当天任务','每天任务先后安排不清楚','任务完成需要较多提醒','学习时间容易被打断','订正后缺少间隔复查','考试后的改进动作不够具体','主动提问和求助不够具体','自主开始和补练还不稳定']};
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function schoolHelpForm(){return `<div class="field full school-help"><span>校内目前还缺哪类帮助？（可多选）</span><div class="help-options">${SCHOOL_HELP.map(([id,label])=>`<label><input type="checkbox" data-help="${id}" ${f('help_'+id)==='1'?'checked':''}>${label}</label>`).join('')}</div><p class="note">例如：错题讲过了，隔几天有没有人再检查；作业做不完，是否有人帮忙调整任务。尚未了解可不选。</p></div>`}
function supportSummary(ms=stats()){const selected=SCHOOL_HELP.filter(([id])=>f('help_'+id)==='1');if(selected.length)return selected.map(([id,label,action])=>({label:'校内还需补充：'+label,text:action,confirmed:true}));if(['部分不匹配','明显不匹配'].includes(f('match'))){const weak=ms.filter(m=>m.count&&(m.avg<3.8||m.lows.length)).sort((a,b)=>a.avg-b.avg);const ids=weak.slice(0,2).map(m=>m.id);return SCHOOL_HELP.filter(x=>ids.includes(x[3])).slice(0,2).map(x=>({label:'优先核实是否缺少：'+x[1],text:'已记录校内帮助不够，具体类别尚未确认。先核实这项支持能否落实；如确实缺少，'+x[2],confirmed:false})).concat(weak.length?[]:[{label:'校内支持需要进一步明确',text:'逐项问清：不会的内容是否有人单独讲、订正后是否复查、任务过多时是否有人调整。确认后再安排补充帮助。',confirmed:false}])}return []}
function schoolForm(){return `<div class="fields">${select('difficulty','学校教的内容，孩子跟得上吗？',['偏基础','适中','偏难','明显超出当前能力'])}${select('match','针对孩子的具体困难，校内帮助够不够？',['匹配','基本匹配','部分不匹配','明显不匹配','信息不足'])}${schoolHelpForm()}</div>${fold('作业、班级和学校资源',`<div class="fields">${input('cohort','本次考试年级总人数','number')}${input('classRank','班级排名','number')}${input('workload','每天作业大约做多久？')}${input('progress','现在学校学到 / 复习到哪里？')}${input('examFrequency','大约多久考一次？')}${input('schoolLevel','学校主要特点')}${input('classPosition','所在班级的主要特点')}${area('resourcePlus','学校已经提供哪些具体帮助？')}${area('resourceLimit','其他暂时得不到的帮助','例如：晚自习没有答疑、错题没有复查、没有对应的选科指导。')}${area('schoolHistory','同校、相近排名的学生往年去了哪里？','有可靠资料再填写，注明年份和来源。')}</div>`)}`}
function scoreTable(){return `<div class="table-wrap"><table class="scorebook"><thead><tr><th>学科 / 计入</th><th>当前分</th><th>满分</th><th>目标分</th><th>目标差距</th><th>定位</th></tr></thead><tbody>${STAGES[app.active].subjects.map((s,i)=>`<tr><td><label class="small-label"><input type="checkbox" data-include="${i}" aria-label="计入${s}分数账" ${f('include'+i)==='0'?'':'checked'}> 计入</label>${app.active==='high'&&i>2?`<input aria-label="${s}名称" data-field="subjectName${i}" value="${esc(f('subjectName'+i)||s)}">`:s}</td>${['now','max','target'].map(k=>`<td><input aria-label="${s}${({now:'当前分',max:'满分',target:'目标分'})[k]}" data-field="${k}${i}" type="number" min="0" step="any" value="${esc(f(k+i))}"></td>`).join('')}<td id="gap${i}">—</td><td><select aria-label="${s}定位" data-field="position${i}"><option value="">待判断</option>${['优势','稳定','短板'].map(o=>`<option ${f('position'+i)===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><p class="note">记录同一次考试、同一分制的成绩。未参加的学科取消“计入”。目标差距只比较本表当前分与目标分，不代表可保证提高的分数。</p><div id="scoreAccount" class="hint"></div>`}
function scoreAccount(){let n=0,t=0,nc=0,tc=0;const rows=[],invalid=[];STAGES[app.active].subjects.forEach((s,i)=>{if(f('include'+i)==='0')return;const a=num(f('now'+i)),b=num(f('target'+i)),c=num(f('max'+i)),name=f('subjectName'+i)||s;const bad=[a,b,c].some(v=>v!==null&&v<0)||(c!==null&&c<=0)||(c!==null&&((a!==null&&a>c)||(b!==null&&b>c)));if(bad)invalid.push(name);rows.push({i,name,now:a,target:b,max:c,gap:a!==null&&b!==null&&!bad?b-a:null,bad,position:f('position'+i)});if(!bad){if(a!==null){n+=a;nc++}if(b!==null){t+=b;tc++}}});return {n,t,nc,tc,rows,invalid,all:rows.length>0&&rows.every(r=>!r.bad&&r.now!==null&&r.target!==null&&r.max!==null)}}
function priorityIssues(ms){const ranks=rankCandidates(ms);const order=new Map(ranks.map((m,i)=>[m.id,i]));return issueOptions(ms).sort((a,b)=>a.n-b.n||(order.get(a.m.id)??99)-(order.get(b.m.id)??99)||a.i-b.i)}
function helpFindings(ms){const issues=priorityIssues(ms),count=issues.length;if(!count)return ['尚未评分，暂不能给出孩子的学习结论。请先完成30项中已经了解的项目。'];const low=issues.filter(x=>x.n<=2);if(low.length)return low.slice(0,3).map(x=>`${FINDINGS[x.m.id][x.i]}（${x.n}分）：${x.n===1?x.m.items[x.i][1]:'已有初步能力，但独立完成仍不稳定，通常需要提示或帮助'}。这项应优先获得具体帮助。`);const mid=issues.filter(x=>x.n===3);if(mid.length)return mid.slice(0,3).map(x=>`${FINDINGS[x.m.id][x.i]}（3分）：${x.m.items[x.i][2]}。重点是从“常规能做”练到“独立稳定做”。`);const min=Math.min(...issues.map(x=>x.n));if(min===4&&demand().target>4)return ['已评分项目均达到4—5分，未出现需要补救的明显短板。相对更高目标，下一步应检查复杂任务、陌生材料和限时情况下能否同样独立完成。'];return [count===30?'30项中没有记录到3分及以下项目，当前无需人为指定短板。优先保持有效方法，每周用不同类型任务检查稳定性。':'已评分项目较稳定；未填写的项目仍需了解，不能把局部高分当成整体没有问题。']}
function rootHypothesis(ms){const count=ms.reduce((a,m)=>a+m.count,0),b=Object.fromEntries(ms.map(m=>[m.id,m])),issues=priorityIssues(ms);if(!count)return ['尚未评分，不能判断主要原因。评分后会结合低分项、前后能力关系和阶段目标形成参考结论。'];const all=ms.every(m=>m.complete),out=[],usable=id=>b[id].complete;const weak=id=>usable(id)&&(b[id].avg<3.5||b[id].lows.length>0);const fact=id=>{const x=issues.find(x=>x.m.id===id);return x?`${FINDINGS[id][x.i]}为${x.n}分`:''};
 if(weak('manage'))out.push(`参考判断：学习任务的落实与复查环节还不稳定（${fact('manage')}），可能使已经听懂的内容不能及时巩固。先把每日任务完成、订正和隔日回看固定下来，否则增加训练也容易落空。`);

 if(usable('think')&&(b.think.avg<3.8||b.think.lows.length)&&usable('base')&&usable('frame')&&b.base.avg>=3.5&&b.frame.avg>=3.5)out.push(`参考判断：基础与常规综合运用已有支撑，进一步提升卡在迁移和自主尝试（${fact('think')}）。应比较不同任务的共同结构，而不是继续只熟记原题做法。`);

function scoreBand(name,n,max){if(max!==150||!MEIBO_BANDS[name]||n===null||n<0||n>max)return null;return MEIBO_BANDS[name].filter(x=>n>=x[0]).slice(-1)[0];}
function capabilityMatch(ms=stats()){const by=Object.fromEntries(ms.map(m=>[m.id,m])),trans=subjectTransitions(),aim=targetProfile();const critical={base:[0,1,2,3,4],frame:[0,2,3],think:[0,1,2,4,5],stable:[0,1,2,4,5],manage:[1,2,4,5,7]};const inferred=trans.length?new Set(trans.flatMap(x=>x.need)):null;const taskVerified=f('assessmentScope')==='包含多次综合、陌生和限时任务的表现';const descriptions={base:'核心概念理解清楚、基础任务正确、隔段时间仍能独立使用。',frame:'面对综合任务，能自己识别要用的知识，组织多步过程。',think:'遇到陌生材料或变式，能提取信息、迁移方法并说明理由。',stable:'在限时与重要考试中读清要求、写全步骤，并让多次表现稳定。',manage:'能计划、完成、订正和复查，使学习安排持续落实。'};return MODULES.map(m=>{const x=by[m.id],items=critical[m.id].map(i=>({i,n:x.values[i]})).filter(y=>y.n),low=items.filter(y=>y.n<=2),mid=items.filter(y=>y.n===3);const later=m.id==='think'&&(!by.base.complete||!by.frame.complete||by.base.lows.length||by.frame.lows.length||by.base.avg<3.5||by.frame.avg<3.5);const needed=m.id==='manage'||(inferred?inferred.has(m.id):m.id!=='think'||aim.highAim||aim.special);const selected=(low.length?low:mid).slice(0,2);let status=!items.length?'待了解':low.length?'具体环节尚未建立':mid.length?'常规可做，独立稳定性不足':needed&&['think','stable'].includes(m.id)&&!taskVerified?'需在目标题型中复核':'已观察到较稳定表现，仍需复查';if(m.id==='base'&&academicConflict(ms).length)status='访谈高评分与单科成绩存在差异，先核对实际基础任务';if(later)status+='；提高难度前先补前置环节';const needSource=trans.filter(t=>t.need.includes(m.id)).map(t=>t.name+'目标'+t.target+'分·'+t.targetBand[1]);return {id:m.id,name:m.name,need:needed?descriptions[m.id]:'所填单科目标先稳基础和框架；本项保留自主尝试，后续随目标推进。',needed,needSource,status,current:x.count?`${x.count}/${x.required}项，均分${x.avg.toFixed(1)}；`+(selected.length?selected.map(y=>FINDINGS[m.id][y.i]+'（'+y.n+'分）').join('、'):'关键项目按访谈描述表现较强'):'尚未评分',weak:low.length||mid.length,priority:later?'先补基础与框架':needed?'本阶段核实':'保留发展，后续推进'};});}
function quantitativeDistance(){const a=scoreAccount(),s=targetScore(),valid=a.rows.length===6&&a.rows.every(r=>!r.bad&&r.now!==null&&r.max!==null),max=a.rows.reduce((z,r)=>z+(r.max||0),0);if(!s?.valid||!s.max||!valid||max!==s.max||f('examScope')!=='高考或覆盖高考范围的模拟考'||!f('scoreComparable').startsWith('已核对'))return '';const gap=s.n-a.n,loss=max-a.n;if(gap<=0)return `本次可比总分${fmt(a.n)}已达到所填${s.n}分目标；下一步核实多次考试能否保持，不因一次达到就认定稳定。`;return `从本次${fmt(a.n)}到目标${s.n}，差${fmt(gap)}分；目标允许失分由目前${fmt(loss)}分压到${fmt(max-s.n)}分，意味着当前失分需减少约${loss>0?(gap/loss*100).toFixed(1):'0'}%。这是差距要求，不是已确认可提高的幅度。`;}

function rawTargetScore(){if(app.active!=='high')return null;let n=num(f('goalScore')),source='填写的总分目标';if(n===null){const m=f('schoolRequirement').match(/(?:高考|总分|目标)[^\d]{0,5}(\d{3}(?:\.\d+)?)(?!\d)/);if(m){n=Number(m[1]);source='目标要求中记录的分数'}}if(n===null)return null;const ac=scoreAccount(),fullRows=ac.rows.length===6&&ac.rows.every(r=>!r.bad&&r.max!==null),explicit=f('goalMax').trim(),max=explicit?num(explicit):fullRows?ac.rows.reduce((s,r)=>s+r.max,0):null;const valid=Number.isFinite(n)&&n>0&&(!explicit||max!==null)&&(max===null||Number.isFinite(max)&&max>0&&n<=max);return {n,max,valid,ratio:valid&&max?n/max:null,source,maxSource:explicit?'填写的目标分制':'本表已填满分合计'};}
function targetProfile(){const st=app.active,score=targetScore(),level=f('normalLevel'),special=arr('paths').some(x=>/强基|竞赛|少年班|拔尖/.test(x)),overseas=/国际/.test(f('pathMain'))||arr('paths').includes('国际方向')&&!arr('paths').includes('普通高考')&&!f('pathMain');const highAim=st!=='primary'&&(['清北','顶尖985','其他985'].includes(level)||f('goalDemand').includes('拔高')||score?.ratio>=.9);let emphasis='基础正确、知识连得起来、日常任务能独立完成。';if(/211|双一流/.test(level))emphasis='基础和常规综合任务稳定后，提高知识联系、跨情境运用和限时完成质量。';if(['其他985','顶尖985'].includes(level))emphasis='在基础和框架扎实的前提下，加强综合分析、陌生情境迁移、推理表达和限时稳定性。';if(level==='清北')emphasis='除稳定掌握必备知识外，还要反复检验复杂任务中的分析、建模、推理、迁移与时间管理。';if(st==='primary')emphasis='大学愿景用于了解兴趣和培养方向；当前看阅读表达、知识理解、自主学习及目标初中的实际入学条件。';if(overseas)emphasis='先核对目标课程体系、语言与具体申请要求，再安排校内课程、自主学习和相应准备。';const name=st==='primary'?(f('normalSchool')||'目标初中'):st==='middle'?(f('normalSchool')||'目标高中'):(goalName('normal')||'大学目标');return {st,score,level,highAim,special,overseas,name,emphasis};}

function rankCandidates(ms){const by=Object.fromEntries(ms.map(m=>[m.id,m])),aim=targetProfile();return ms.filter(m=>m.complete).map(m=>{let prereq=0;const notes=[],hasGap=x=>x.complete&&(x.avg<3.5||x.lows.length);let blocked=false;if(m.id==='base'&&hasGap(m)){prereq+=1.8;notes.push('基础是综合与迁移的前置条件')}if(m.id==='frame'&&hasGap(m)){prereq+=by.base.complete&&!hasGap(by.base)?1.4:.3;notes.push('先区分知识未掌握还是不会连接调用')}if(m.id==='manage'&&hasGap(m)){prereq+=m.avg<3?1.5:.8;notes.push('任务落实与复查影响其他训练')}if(m.id==='stable'&&hasGap(m)&&by.base.complete&&!hasGap(by.base))prereq+=1.2;if(m.id==='think'&&(!by.base.complete||!by.frame.complete||hasGap(by.base)||hasGap(by.frame))){blocked=true;notes.push('基础或框架尚不稳，拔高后置')}const sp=f('space_'+m.id),space=sp.startsWith('较大')?1.2:sp.startsWith('有限')?.15:.65;const value=Math.max(0,4-m.avg)*2+Math.max(0,2.5-m.avg)*1.2+prereq+space+Math.min(.8,m.lows.length*.2)+(aim.highAim&&['think','stable'].includes(m.id)&&!blocked?.15:0);notes.push(sp?'改善条件：'+display(sp):'改善条件尚未确认');return {...m,value,notes,blocked,spaceUnknown:!sp};}).filter(m=>m.avg<4||m.lows.length).sort((a,b)=>Number(a.blocked)-Number(b.blocked)||b.value-a.value);}
function learningStage(ms=stats()){const by=Object.fromEntries(ms.map(m=>[m.id,m])),weak=id=>by[id].count&&(by[id].avg<3.5||by[id].lows.length),qual=Object.values(by).every(m=>m.complete);let id=weak('base')?'base':weak('frame')?'frame':weak('think')?'think':weak('stable')?'stable':weak('manage')?'manage':'verify';if(!ms.some(m=>m.count))id='unknown';const titles={base:'先打牢基础',frame:'先建立知识框架',think:'再做思维与迁移突破',stable:'重点改善稳定发挥',manage:'先让学习安排落实',verify:'用新任务核实学习上限',unknown:'先了解学习表现'};return {id,title:titles[id],complete:qual,by};}
function admissionReference(){if(app.active!=='high')return [];const need=['admissionRegion','admissionCategory','examYear','provinceRank','targetGroup','referenceYear','targetRank','admissionSource'];const missing=need.filter(k=>!f(k).trim());if(missing.length||f('rankComparable')!=='已核对同省同类别；跨年只作历史参照')return ['大学录取定位：依据尚不足。需核对省份、类别、年份、正式省排名及具体专业组的录取资料；本次不判断“能否录取”。'+(f('rank')?'已记录的年级第'+f('rank')+'名只说明校内位置。':'')];const n=num(f('provinceRank')),r=num(f('targetRank')),ey=num(f('examYear')),ry=num(f('referenceYear'));if(!n||!r||n<1||r<1||!Number.isInteger(n)||!Number.isInteger(r)||!ey||!ry||ey<2000||ey>2100||ry<2000||ry>2100)return ['大学录取定位：省排名或年份格式需核对，暂不进行历史位次比较。'];const d=r-n;return [`大学录取参考：${f('admissionRegion')}·${f('admissionCategory')}，${f('examYear')}年当前省排名${n}；${f('targetGroup')}的${f('referenceYear')}年参考最低录取位次${r}。当前较该参考${d===0?'相同':d>0?'靠前'+d+'位':'靠后'+(-d)+'位'}。这只表示历史参照位置，须继续核对当年招生计划、选科与专业限制。来源：${f('admissionSource')}（老师填写，页面未自动核验）。`];}
function resultEvidence(){const st=app.active,aim=targetProfile(),s=aim.score,a=scoreAccount(),lines=[];if(st!=='high'){lines.push((st==='primary'?'初中目标：':'高中目标：')+aim.name+'。'+(f('schoolRequirement')?'已记录入学要求：'+f('schoolRequirement')+'；还需核对当地实际条件。':'具体入学条件尚待核对，当前评分不能替代中考成绩、当地名额或入学资格。'));const g=goalChain();for(const l of g.links)lines.push(l.label+'：'+l.state+'。'+(l.state==='需要调整'||l.state==='需要补条件'?l.action:l.state==='初步支持'?'这是已填写的衔接判断，仍需核实课程、选科与实际入学条件。':'先对照下一阶段实际要求与学校资源。'));return lines;}lines.push('大学目标：'+aim.name+'。'+(f('natural')?'当前大致去向（老师填写）：'+f('natural')+'。':''));if(f('gapStatus'))lines.push('已填目标距离判断：'+f('gapStatus')+'（保留为访谈记录，页面不据此认定已达标）。');if(s){if(!s.valid)lines.push('总分目标与满分不匹配，请先核对；暂不计算得分率。');else if(s.max)lines.push(`${s.source}${s.n}/${s.max}，相当于约${(s.ratio*100).toFixed(1)}%得分率，距满分可失${fmt(s.max-s.n)}分（满分依据：${s.maxSource}）。这是目标的算术要求，不是达到目标的概率。`);else lines.push('已记录总分目标'+s.n+'分；目标满分尚未明确，暂不计算得分率。');const completeCurrent=a.rows.length===6&&a.rows.every(r=>!r.bad&&r.now!==null&&r.max!==null),sumMax=a.rows.reduce((z,r)=>z+(r.max||0),0);if(s.valid&&s.max&&completeCurrent&&sumMax===s.max&&f('scoreComparable').startsWith('已核对')&&f('examScope')==='高考或覆盖高考范围的模拟考')lines.push('成绩依据：'+(f('examName')||'本次考试')+'，老师已核对与目标可比；一次考试仍不足以说明长期稳定水平。');else if(a.nc)lines.push('本次成绩与高考目标的范围、难度或满分尚未核对可比，暂不把月考差额写成高考提分任务。');}if(aim.overseas)lines.push('当前关注国际方向，高考分数目标只作独立记录；具体课程、语言与申请要求需按目标项目核对。');else lines.push(...admissionReference());return lines;}
function readinessText(ms=stats()){const aim=targetProfile(),count=ms.reduce((s,m)=>s+m.count,0),issues=issueOptions(ms),mid=issues.filter(x=>x.n===3),low=issues.filter(x=>x.n<=2);let text='学习准备：';if(!count)return text+'尚未评分，不能判断准备情况。';if(low.length)text+='仍有'+low.length+'项需要帮助，先处理'+low.slice(0,2).map(x=>FINDINGS[x.m.id][x.i]).join('、')+'。';else if(mid.length)text+='有'+mid.length+'项为3分，说明常规能做但尚未独立稳定；不能据此认定升学目标已具备条件。';else text+='已评分行为表现较强，仍需用与目标相符的任务和多次考试验证，不能由高评分推算高考分数。';if(aim.score?.valid&&!aim.overseas&&!(comparableTotal()?.now>=aim.score.n))text+=' 对'+aim.score.n+'分目标，'+(mid.length||low.length?'目前的行为评分尚不能支持“已经准备好”的判断。':'目前只能确认已观察到的学习表现，尚不能认定必能达到。');const actual=comparableTotal();if(actual&&actual.now>=actual.target)text+=' 本次可比考试已达到所填目标；行为评分中的不稳表现仍需复查，后续是否稳定要看多次考试。';if(count<30)text+=' 尚有'+(30-count)+'项未了解。';if(f('assessmentScope')!=='包含多次综合、陌生和限时任务的表现')text+=' 评分所依据的任务难度与独立完成情况还需核实。';return text;}
function targetCapabilityGaps(ms){const by=Object.fromEntries(ms.map(m=>[m.id,m]));return [['base',[1,2,4],'概念和基础题的独立正确率'],['frame',[2,3],'综合任务中自己选方法、组织步骤'],['think',[0,2,4],'陌生材料中的信息提取与迁移'],['stable',[0,1,2,5],'限时作答质量与多次考试的稳定性']].filter(([id,ids])=>ids.some(i=>by[id].values[i]&&by[id].values[i]<4)).map(x=>x[2]);}
function referenceSummary(ms){const count=ms.reduce((s,m)=>s+m.count,0);if(!count)return '尚未评分，先了解孩子在课堂、作业、复习和考试中的独立表现，再生成学习判断。';const plus=ms.filter(m=>m.complete&&m.avg>=4&&!m.lows.length),issues=priorityIssues(ms),weak=issues.filter(x=>x.n<=3).slice(0,2),stage=learningStage(ms);const lines=[];const conflicts=academicConflict(ms);if(conflicts.length)lines.push('需交叉核对：'+conflicts.map(x=>x.name+fmt(x.now)+'/'+x.max).join('、')+'按美博教学参考仍需先查基础，与本次基础行为高评分不一致。先用实际任务区分知识缺口、试卷难度与考试失误，暂不直接安排高难训练。');if(plus.length)lines.push('已有优势：'+plus.map(m=>m.name).join('、')+'，按已评分任务表现较稳定，继续保持。');else{const strengths=issues.filter(x=>x.n>=4).slice(0,2);lines.push(strengths.length?'可以保持：'+strengths.map(x=>({base:'基础知识掌握',frame:'知识联系与调用',think:'自主分析与尝试',stable:'考试流程执行',manage:'目标与任务安排'}[x.m.id])+'中的已评分做法（'+x.n+'分）').join('；')+'。':'整体尚处于需要提示或提高稳定性的阶段，先建立可独立完成的学习流程。');}if(weak.length)lines.push('当前卡点：'+weak.map(x=>FINDINGS[x.m.id][x.i]+'（'+x.n+'分）').join('；')+'。');const roots=rootHypothesis(ms),chosen=rankCandidates(ms).find(x=>!x.blocked);const hints={base:'知识理解、保持',frame:'独立选方法',think:'迁移和自主尝试',stable:'考试中的',manage:'落实与复查'};lines.push(roots.find(x=>chosen&&x.includes(hints[chosen.id]))||roots[0]);if(stage.id==='base'||stage.id==='frame')lines.push('教学顺序：'+stage.title+'，稳定后再提高综合与陌生任务要求。');if(count<30)lines.push('已了解'+count+'/30项，以上为局部参考，未评内容不作结论。');return lines.join('\n');}
function concisePlan(ms){const count=ms.reduce((s,m)=>s+m.count,0),p=selectedPlan(ms),stage=learningStage(ms),aim=targetProfile(),budget=weeklyBudget(),days=remainingDays();if(!count||!p)return '先完成已了解的学习评分，再确定当前主攻方向。已有课程与作息先保持，避免在不了解问题时加量。';let first=stage.id;const conflicts=academicConflict(ms);const chosen=p.m.id;if(['base','frame','think','stable','manage'].includes(chosen)&&!(['base','frame'].includes(stage.id)&&chosen==='think'))first=chosen;const routines={base:'从已有作业选一处真实知识缺口：讲清概念→学生独立做→隔几天换材料再查。',frame:'选一道常规综合任务：先说涉及哪些知识、先后怎么做，再独立完成并画出联系。',think:'在基础、常规综合任务稳住后，少量换材料、换问法，让孩子说明条件、思路及为什么这样做。',stable:'用现有练习练“读清要求→安排时间→写全过程→回查”，区分确实不会与会做却失分。',manage:'每天在原有任务中约定两件要事，孩子排顺序并完成；晚间核对，隔几天复查订正。',verify:'从现有任务中选综合、陌生和限时材料，独立完成后再讲；用换任务后的表现验证，而非只看原题正确率。'};const lines=['当前主攻：'+(conflicts.length?'先从现有试卷抽取基础、综合与限时任务核查：区分知识不会、方法不会用，还是会做未拿到分；对齐行为评分与实际成绩后再定难度。':routines[first]||routines.verify)];if(first==='think'&&stage.id==='base'||first==='think'&&stage.id==='frame')lines[0]='当前主攻：'+routines[stage.id];if(stage.by.manage.count&&(stage.by.manage.avg<3.5||stage.by.manage.lows.length)&&first!=='manage')lines.push('配合落实：每天约定两件核心任务并回看，由教务每周检查执行。');if(days!==null&&days<=14)lines.push('阶段推进：距关键考试约'+days+'天，先稳住已会内容和答题节奏；本次考试后再补系统框架、推进综合与迁移。');else lines.push('阶段推进：'+(f('semesterGoal')?'本学期先落实“'+f('semesterGoal')+'”；':'先让当前环节能独立完成并隔几天仍能做好；')+(aim.highAim?'再围绕高目标检验综合、陌生和限时任务，基础不稳时不直接堆难题。':app.active==='primary'?'逐步增加阅读表达和自主安排，按目标初中的条件准备，不提前套用高考训练。':'随后逐步衔接综合任务、迁移应用与稳定考试表现。'));const selectedSupport=SCHOOL_HELP.filter(([id])=>f('help_'+id)==='1').slice(0,2);lines.push('分工与负担：'+(f('owner')||'任课老师诊断卡点并用新任务检验，学生落实，教务跟进，家长只核对约定')+'。'+(budget===0?'在现有作业中调整方法，不新增练习。':budget!==null?'额外规划任务每周合计不超过'+budget+'分钟，替换同类重复练习。':'先替换同类重复练习，具体时间结合现有负担确认。')+(selectedSupport.length?'校内缺少的“'+selectedSupport.map(x=>x[1]).join('、')+'”由教务协调补上。':''));return lines.join('\n');}

function lookupRegion(){const raw=(f('admissionRegion')||f('region')||'四川').trim();return !f('admissionRegion')&&/^(成都|绵阳|德阳|乐山|南充|宜宾|泸州|自贡|遂宁|资阳|内江|达州|眉山|雅安|广元|巴中|广安|攀枝花)/.test(raw)?'四川':raw;}
function targetScore(){const s=rawTargetScore();if(!s||s.max!==null||f('goalMax').trim()||!lookupRegion().includes('四川'))return s;return {...s,max:750,maxSource:'四川普通类默认750分制',valid:s.n>0&&s.n<=750,ratio:s.n>0&&s.n<=750?s.n/750:null};}
function lookupCategory(){return f('admissionCategory')||'';}
function lookupYear(){return f('lookupYear')||'2026';}
function rankAt(score,year=lookupYear(),category=lookupCategory()){if(!lookupRegion().includes('四川')||!['物理类','历史类'].includes(category)||!Number.isInteger(Number(score)))return null;const key=year+'-'+(category==='物理类'?'physics':'history'),set=ADMISSION_DATA.ranks[key];if(!set)return null;const row=set.rows[String(Number(score))];if(row)return {score:Number(score),year,category,start:row[1]?row[0]-row[1]+1:row[0],end:row[0],count:row[1],empty:row[1]===0,source:set.source};const highest=Math.max(...Object.keys(set.rows).map(Number));if(Number(score)>highest&&Number(score)<=750){const top=set.rows[String(highest)],end=top[0]-top[1];return {score:Number(score),year,category,start:1,end,count:null,upperBound:true,source:set.source};}return null;}
function rankText(r){return r?r.upperBound?'≤ '+r.end.toLocaleString():r.empty?'累计前 '+r.end.toLocaleString():r.start===r.end?r.end.toLocaleString():r.start.toLocaleString()+'—'+r.end.toLocaleString():'待查询';}
function allocationSubjects(){const defaults=[150,150,150,100,100,100];return STAGES.high.subjects.map((s,i)=>{const max=f('max'+i).trim()?num(f('max'+i)):defaults[i],now=f('include'+i)==='0'?null:num(f('now'+i));return {i,name:f('subjectName'+i)||s,max,now:now!==null&&max!==null&&now>=0&&now<=max?now:null};});}
function boundedParts(total,lower,upper,weights){const parts=lower.slice();let left=total-parts.reduce((s,n)=>s+n,0);for(let pass=0;pass<10&&left>1e-8;pass++){const open=parts.map((n,i)=>upper[i]-n>1e-8?i:-1).filter(i=>i>=0),w=open.reduce((s,i)=>s+weights[i],0);if(!open.length)break;let used=0;for(const i of open){const add=Math.min(upper[i]-parts[i],left*(w?weights[i]/w:1/open.length));parts[i]+=add;used+=add;}if(used<1e-10)break;left-=used;}const unit=Math.abs(total-Math.round(total))<1e-8?1:100,ints=parts.map(x=>Math.floor((x+1e-8)*unit));let remain=Math.round(total*unit)-ints.reduce((s,x)=>s+x,0);const order=parts.map((x,i)=>({i,frac:x*unit-ints[i]})).sort((a,b)=>b.frac-a.frac||a.i-b.i);while(remain>0){let changed=false;for(const {i} of order){if(remain&&ints[i]+1<=Math.round(upper[i]*unit)){ints[i]++;remain--;changed=true;}}if(!changed)break;}return ints.map(n=>n/unit);}
function allocationState(){if(app.active!=='high')return null;const target=targetScore(),rows=allocationSubjects();if(!target||!target.valid||!target.max)return {valid:false,message:'先填写目标总分和满分，即可生成分科建议。',rows:[]};if(rows.some(r=>r.max===null||r.max<=0))return {valid:false,message:'请先核对各科满分。',rows:[]};const full=rows.reduce((s,r)=>s+r.max,0);if(Math.abs(full-target.max)>.01)return {valid:false,message:'各科满分合计'+fmt(full)+'，与目标满分'+target.max+'不一致，请先核对分制。',rows:[]};const complete=rows.every(r=>r.now!==null),currentTotal=complete?rows.reduce((s,r)=>s+r.now,0):null,manual=rows.some(r=>Object.prototype.hasOwnProperty.call(current().fields,'goalPart'+r.i)),lower=complete&&target.n>=currentTotal?rows.map(r=>r.now):rows.map(()=>0),shape=[125/150,140/150,140/150,.95,.9,.9];const weights=rows.map((r,i)=>complete&&target.n>=currentTotal?Math.max(0,r.max-r.now):r.max*shape[i]);const automatic=boundedParts(target.n,lower,rows.map(r=>r.max),weights);const items=rows.map((r,i)=>{const raw=f('goalPart'+i),has=Object.prototype.hasOwnProperty.call(current().fields,'goalPart'+i),part=has?num(raw):automatic[i],bad=part===null||part<0||part>r.max;return {...r,target:part,automatic:automatic[i],bad,gap:r.now!==null&&part!==null?Math.round((part-r.now)*100)/100:null};});const comparable=!!comparableTotal();items.forEach(r=>{if(!comparable)r.gap=null;});const sum=items.filter(r=>!r.bad).reduce((s,r)=>s+r.target,0),aligned=!items.some(r=>r.bad)&&Math.abs(sum-target.n)<.01;return {valid:true,items,target:target.n,max:full,complete,comparable,current:currentTotal,manual,sum,aligned,delta:Math.round((target.n-sum)*100)/100,message:aligned?'分科合计 '+fmt(sum)+' 分':items.some(r=>r.bad)?'请核对超出范围或留空的分科目标':'分科合计 '+fmt(sum)+' 分，还需调整 '+fmt(target.n-sum)+' 分'};}
function pinAllocation(){const a=allocationState();if(!a?.valid)return;a.items.forEach(r=>{if(!Object.prototype.hasOwnProperty.call(current().fields,'goalPart'+r.i))current().fields['goalPart'+r.i]=String(r.target);});}
function resetAllocation(){const fields=current().fields;fields.allocationUndo=JSON.stringify(Object.fromEntries(Object.entries(fields).filter(([k])=>/^goalPart\d$/.test(k))));Object.keys(fields).filter(k=>/^goalPart\d$/.test(k)).forEach(k=>delete fields[k]);save();updateLive();toast('已按当前总分目标重新生成，可撤销。');}
function undoAllocation(){try{const old=JSON.parse(f('allocationUndo'));Object.keys(current().fields).filter(k=>/^goalPart\d$/.test(k)).forEach(k=>delete current().fields[k]);Object.entries(old).filter(([k,v])=>/^goalPart[0-9]$/.test(k)&&typeof v==='string').forEach(([k,v])=>current().fields[k]=v);delete current().fields.allocationUndo;save();updateLive();toast('已恢复替换前的分科安排。');}catch(e){toast('暂无可恢复的安排。');}}
function adoptExistingTargets(){const fields=current().fields;fields.allocationUndo=JSON.stringify(Object.fromEntries(Object.entries(fields).filter(([k])=>/^goalPart\d$/.test(k))));for(let i=0;i<6;i++)fields['goalPart'+i]=f('target'+i);save();updateLive();toast('已采用分数账中填写的目标，请核对合计。');}
function allocationHTML(editable=false){const a=allocationState();if(!a)return '';if(!a.valid)return `<div class="allocation-empty">${esc(a.message)}</div>`;return `<div class="allocation-box"><div class="target-subhead"><b>各科怎样凑到 ${fmt(a.target)} 分</b><span class="allocation-status ${a.aligned?'':'needs-adjustment'}">${esc(a.message)}${editable?' · '+(a.manual?'老师已调整':a.complete?'结合当前分数结构拟定':'通用结构建议'):''}</span></div><div class="table-wrap"><table class="allocation-table"><thead><tr><th>学科</th><th>当前分</th><th>建议目标</th><th>差额</th></tr></thead><tbody>${a.items.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.now===null?'—':fmt(r.now)}</td><td>${editable?`<input aria-label="${esc(r.name)}分科目标" data-field="goalPart${r.i}" type="number" step="any" min="0" max="${r.max}" value="${esc(f('goalPart'+r.i)||String(r.target??''))}">`:`<b>${r.bad?'待核对':fmt(r.target)}</b>`}<small>/ ${r.max}</small></td><td ${editable?'id="partGap'+r.i+'"':''}>${r.bad||r.gap===null?'—':(r.gap>0?'+':'')+fmt(r.gap)}</td></tr>`).join('')}</tbody><tfoot><tr><td>合计</td><td>${a.current===null?'部分成绩':fmt(a.current)}</td><td ${editable?'id="partSum"':''}>${fmt(a.sum)} / ${a.max}</td><td ${editable?'id="partDifference"':''}>${a.current===null||!a.comparable?'—':(a.sum-a.current>0?'+':'')+fmt(a.sum-a.current)}</td></tr></tfoot></table></div>${editable?`<div class="edit-tools"><button data-allocation="reset">按目标重新生成</button>${f('allocationUndo')?'<button data-allocation="undo">撤销本次替换</button>':''}${[0,1,2,3,4,5].every(i=>num(f('target'+i))!==null)?'<button data-allocation="existing">采用已填各科目标</button>':''}</div><p class="allocation-caption">${a.complete?'结合当前成绩结构给出起始分配':'当前成绩未填完整，先给出通用分数结构'}；可逐科调整，是否可实现还要结合学习表现判断。</p>`:''}</div>`;}
function universityRecords(){if(app.active!=='high'||!lookupRegion().includes('四川')||!lookupCategory())return [];let raw=(f('normalUni')+' '+f('majorSpecific')).replace(/\s+/g,'');if(!raw.trim())return [];if(/电子科技大学成都学院/.test(raw))return [];const catalog=ADMISSION_DATA.schools.filter(s=>s.aliases.some(a=>raw.includes(a))).sort((a,b)=>Math.max(...b.aliases.filter(x=>raw.includes(x)).map(x=>x.length))-Math.max(...a.aliases.filter(x=>raw.includes(x)).map(x=>x.length)));if(!catalog.length)return [];const best=catalog[0];let rows=ADMISSION_DATA.records.filter(r=>r.school===best.name&&r.category===lookupCategory());if(f('lookupYear')&&f('lookupYear')!=='2026')rows=rows.filter(r=>String(r.year)===f('lookupYear'));if(!rows.length)return [];const latest=Math.max(...rows.map(r=>r.year));return rows.filter(r=>r.year===latest);}
function selectedUniversity(){const manualRank=num(f('targetRank')),manualYear=num(f('referenceYear'));if(f('targetGroup')&&f('admissionSource')&&manualRank>0&&Number.isInteger(manualRank)&&manualYear>=2000&&manualYear<=2100&&f('rankComparable')==='已核对同省同类别；跨年只作历史参照')return {id:'teacher-reference',school:f('normalUni')||'老师补充院校',year:manualYear,category:lookupCategory(),score:null,rank:manualRank,label:f('targetGroup'),scope:'manual',source:/^https?:\/\//.test(f('admissionSource'))?f('admissionSource'):'',sourceText:f('admissionSource')};const rows=universityRecords();if(!rows.length)return null;const manual=rows.find(r=>r.id===f('autoRecordId'));if(manual)return manual;const raw=f('normalUni')+' '+f('majorSpecific'),specific=rows.filter(r=>r.major&&(raw.includes(r.major)||/计算机/.test(raw)&&r.major==='计算机科学与技术'||/软件/.test(raw)&&r.major==='软件工程'));return specific[0]||rows.find(r=>r.default)||rows[0];}
function universityRank(record){if(!record)return null;if(record.rank)return {start:record.rank,end:record.rank,year:record.year,category:record.category,exact:true,source:record.source};const r=rankAt(Math.floor(record.score),String(record.year),record.category);return r?{...r,exact:false}:null;}
function autoAdmissionHTML(report=false){if(app.active!=='high')return '';const s=targetScore(),goalRank=s?.valid&&s.max===750?rankAt(s.n):null,record=selectedUniversity(),rows=universityRecords(),r=universityRank(record);const unavailable=!lookupRegion().includes('四川')?'其他地区可在补充资料中记录当地正式数据':!lookupCategory()?'先选物理类或历史类，即可查四川参考位次':!f('normalUni')?'填写目标院校名称后，自动匹配已核对资料':'该院校或专业暂无已核对数据';return `<div class="admission-reference"><div class="admission-reference-head"><b>院校与省位次参考</b><span>${esc(lookupRegion())}${lookupCategory()?' · '+esc(lookupCategory()):''}</span></div><div class="admission-grid"><div><span>目标分同分参考位次</span><strong>${goalRank?rankText(goalRank)+' 位':'—'}</strong><small>${goalRank?goalRank.year+'年一分一段'+(goalRank.upperBound?' · 超出表首，仅知范围':goalRank.empty?' · 该分段0人':''):lookupRegion().includes('四川')&&lookupCategory()?'该分数或分制暂无数据':'选择省份与类别后查询'}</small></div><div><span>${record?esc(record.school)+' · '+record.year+'年':'目标院校参考'}</span><strong>${record?record.score===null?'以位次为参考':fmt(record.score)+' 分':'待匹配'}</strong><small>${record?esc(record.label):esc(unavailable)}</small></div><div><span>${r?.exact?'官方最低录取位次':'参考分对应省位次'}</span><strong>${r?rankText(r)+' 位':'—'}</strong><small>${record?r?(r.exact?'学校公布':'按'+record.year+'年同分区间换算'):'该条资料未公布位次':'未覆盖数据不作推算'}</small></div></div>${!report&&rows.length>1?`<label class="field reference-choice"><span>专业 / 专业组参考</span><select data-field="autoRecordId"><option value="">自动匹配：${esc(record.label)}</option>${rows.map(x=>`<option value="${x.id}" ${f('autoRecordId')===x.id?'selected':''}>${x.year} · ${esc(x.label)} · ${x.score===null?'位次参考':fmt(x.score)+'分'}</option>`).join('')}</select></label>`:''}${record?`<p class="source-line">${record.source?'<a href="'+esc(record.source)+'" target="_blank" rel="noopener">院校来源</a>':esc(record.sourceText||'老师补充资料')}${goalRank?' · <a href="'+goalRank.source+'" target="_blank" rel="noopener">一分一段来源</a>':''} · 数据核对 ${ADMISSION_DATA.checked}${record.scope==='school'&&/计算机|医学|法学|金融|软件|临床/.test(f('normalUni')+' '+f('majorSpecific'))?' · 校级参考，所选专业要求需另核实':''}</p>`:report?'':`<p class="source-line">已核对资料按实际年份显示。<a href="https://plan.sceea.cn/" target="_blank" rel="noopener">四川招生查询</a></p>`}</div>`;}
function targetSnapshotHTML(){if(app.active!=='high')return '';const s=targetScore(),a=allocationState(),comparable=comparableTotal(),currentTotal=a?.valid?a.current:null;return `<div class="target-snapshot"><div class="target-school"><span>大学目标</span><h3>${esc(goalName('normal')||'待确定')}</h3>${f('natural')?'<p>当前大致方向：'+esc(f('natural'))+'</p>':''}</div><div class="target-numbers"><div><span>${esc(f('examName')||'本次考试')}</span><strong>${currentTotal===null?'—':fmt(currentTotal)}</strong></div><div class="target-main-number"><span>目标总分${s?.max?' / '+s.max:''}</span><strong>${s?.valid?fmt(s.n):'—'}</strong></div><div><span>${comparable?'同口径分差':'分差'}</span><strong>${comparable?(comparable.target-comparable.now>0?'+':'')+fmt(comparable.target-comparable.now):'待核对'}</strong></div></div></div>`;}
function compactTargetText(ms){if(app.active!=='high'){const g=goalChain();return [(app.active==='primary'?'初中目标：':'高中目标：')+targetProfile().name+'。',...g.links.map(l=>l.label+'：'+l.state+'。'),learningStage(ms).title+'，逐步准备下一阶段学习。'].join('\n');}const match=capabilityMatch(ms),count=ms.reduce((s,m)=>s+m.count,0),weak=match.filter(x=>x.weak&&x.needed).slice(0,2),low=issueOptions(ms).filter(x=>x.n<=2).length,mid=issueOptions(ms).filter(x=>x.n===3).length;if(!count)return '完成整体学习了解后，补充孩子与目标之间的主要能力差距。';return [(weak.length?'准备重点：'+weak.map(x=>x.name).join('、')+'，要从常规能做练到独立稳定。':'准备重点：用综合、陌生和限时任务验证已有能力。'),low?'当前有'+low+'项明显困难，先补影响后续学习的环节。':mid?'当前有'+mid+'项仍不够稳定，尚需验证在目标难度下的表现。':'已评分表现较稳定，继续检验多次考试与换任务后的保持情况。',academicConflict(ms).length?'成绩与行为评分存在差异，先用实际任务复核。':''].filter(Boolean).join('\n');}
function autoReference(ms=stats()){return {summary:referenceSummary(ms),target:compactTargetText(ms),plan:concisePlan(ms),review:conciseReview(ms)};}
function admissionInputs(){return `<div class="goal-card"><h3>总分与查询范围</h3><div class="fields">${input('goalScore','希望争取的高考总分','number','如680，系统生成分科建议')}<label class="field"><span>这个目标的满分</span><input data-field="goalMax" type="number" value="${esc(f('goalMax')||(lookupRegion().includes('四川')?'750':''))}" placeholder="按实际分制填写"></label>${select('admissionCategory','首选科目',['物理类','历史类'])}<label class="field"><span>高考省份</span><input data-field="admissionRegion" value="${esc(lookupRegion())}" placeholder="四川"></label><label class="field"><span>参考分数表年份</span><select data-field="lookupYear"><option value="2026" ${lookupYear()==='2026'?'selected':''}>2026（最新已核对）</option><option value="2025" ${lookupYear()==='2025'?'selected':''}>2025</option></select></label></div><p class="note">默认使用2026年四川分数表；院校资料显示已核验的最近年份。</p></div>`;}
function admissionEvidenceForm(){return fold('补充可比考试与院校资料',`<div class="fields">${select('examScope','这次考试覆盖范围',['高考或覆盖高考范围的模拟考','学期或阶段考试','部分章节测试','尚不清楚'])}${select('scoreComparable','本次总分与高考目标是否可比？',['已核对：考试范围、难度口径及满分可比较','不能直接比较 / 尚未核对'])}${input('examYear','成绩年份','number')}${input('provinceRank','已有正式省排名（选填）','number')}${input('targetGroup','另行核对的目标专业 / 专业组')}${input('referenceYear','自填院校资料年份','number')}${input('targetRank','自填专业录取位次','number')}${input('admissionSource','自填资料来源')}${select('rankComparable','自填位次的口径',['已核对同省同类别；跨年只作历史参照','尚未核对'])}</div>`);}
function planningForm(){return `<div class="planning-intro"><b>先看差距，再定安排。</b><p>参考文字可直接编辑，修改后自动保存并用于家长报告。</p></div><div class="fields">${input('semesterGoal','本学期希望看到的变化（选填）')}${input('weeklyMinutes','每周可额外安排的分钟数（选填）','number','0表示不加量')}${input('reviewDate','首次复查日期（选填）','date')}${input('owner','分工（选填）')}</div><div id="referenceNotice" class="reference-notice"></div>${app.active==='high'?'<div id="targetSnapshot"></div><div id="allocationPanel"></div><div id="autoAdmissionPanel"></div>':''}${EDIT_SECTIONS.map(([k,t])=>editorCard(k,t)).join('')}${fold('展开目标能力对照',`<div id="targetMatch"></div>`)}${fold('数据来源与判断依据',basisHTML())}`;}
function updateLive(){updateLearningLive();if($('targetSnapshot'))$('targetSnapshot').innerHTML=targetSnapshotHTML();if($('allocationPanel')){const active=document.activeElement,key=active?.dataset?.field;if(!key||!/^goalPart\d$/.test(key))$('allocationPanel').innerHTML=allocationHTML(true);else{const a=allocationState(),status=$('allocationPanel').querySelector?.('.allocation-status');if(status&&a?.valid){status.textContent=a.message+' · 老师已调整';status.classList.toggle('needs-adjustment',!a.aligned);if($('partSum'))$('partSum').textContent=fmt(a.sum)+' / '+a.max;if($('partDifference'))$('partDifference').textContent=a.current===null||!a.comparable?'—':(a.sum-a.current>0?'+':'')+fmt(a.sum-a.current);a.items.forEach(r=>{if($('partGap'+r.i))$('partGap'+r.i).textContent=r.bad||r.gap===null?'—':(r.gap>0?'+':'')+fmt(r.gap);});}}}if($('autoAdmissionPanel'))$('autoAdmissionPanel').innerHTML=autoAdmissionHTML(false);}
function renderReport(){const ms=stats(),refs=autoReference(ms),count=ms.reduce((s,m)=>s+m.count,0),sig=referenceSignature();$('reportRoot').innerHTML=`<article class="report concise-report v8-report"><div class="report-header"><img class="report-logo" src="${MEIBO_LOGO}" alt="美博教育 Logo"><div class="eyebrow">美博教育</div><h2>${f('name')?esc(f('name'))+'｜':''}学习现状分析与规划建议</h2><p class="meta">看清当前情况 · 梳理升学目标 · 明确改善方向</p><p class="meta">${esc([f('grade'),f('school'),f('teacher')?'负责老师：'+f('teacher'):'',f('interviewDate')||localDate()].filter(Boolean).join(' · '))} · 已了解${count}/30项</p></div><div class="report-module-strip">${ms.map(m=>'<div><span>'+m.name+'</span><b>'+(m.avg===null?'—':m.avg.toFixed(1))+'</b>'+(m.lows.length?'<small>'+m.lows.length+'个低项</small>':'')+'</div>').join('')}</div>${EDIT_SECTIONS.map(([key,title],i)=>'<section class="report-block"><h3><span>'+String(i+1).padStart(2,'0')+'</span>'+title+'</h3>'+(key==='target'&&app.active==='high'?targetSnapshotHTML()+allocationHTML(false)+autoAdmissionHTML(true):'')+'<div class="preline">'+esc(effectiveReference(key,refs)||'本项暂未填写。')+'</div>'+(hasEdit(key)&&f('editContext_'+key)!==sig?'<p class="edit-warning no-print">该段文字编辑后资料有变化，请复核。</p>':'')+'</section>').join('')}${app.active==='primary'&&Object.keys(current().potential).length?'<section class="report-block"><h3>兴趣与发展观察</h3><p>'+esc(potentialConclusion().type+'。'+potentialConclusion().reason)+'</p></section>':''}${app.active==='high'?'':compactScoreAppendix()}<div class="report-footer">分科分数与院校资料用于规划参考，具体安排由老师结合实际表现确认。院校数据按所示年份与类别使用。</div></article>`;}
function subjectTransitions(){if(app.active!=='high'||f('examScope')!=='高考或覆盖高考范围的模拟考'||!f('scoreComparable').startsWith('已核对'))return [];const plan=allocationState(),rows=plan?.valid?plan.items:scoreAccount().rows;return rows.filter(r=>!r.bad&&r.now!==null&&r.target!==null).flatMap(r=>{const now=scoreBand(r.name,r.now,r.max),target=scoreBand(r.name,r.target,r.max);return now&&target?[{...r,nowBand:now,targetBand:target,need:target[2],currentNeed:now[2]}]:[];});}


document.addEventListener('focusout',e=>{if(/^goalPart[0-9]$/.test(e.target?.dataset?.field||''))setTimeout(updateLive,0)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){if(t.type==='number'&&t.validity.badInput)return;if(/^goalPart[0-9]$/.test(t.dataset.field))pinAllocation();current().fields[t.dataset.field]=t.value;if(t.dataset.field.startsWith('edit_'))current().fields['editContext_'+t.dataset.field.slice(5)]=referenceSignature();save();updateLive()}else if(t.dataset.evidence){current().evidence[t.dataset.evidence]=t.value;save();updateLive()}else if(t.dataset.pevidence){current().potentialEvidence[t.dataset.pevidence]=t.value;save();updateLive()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.include!==undefined){current().fields['include'+t.dataset.include]=t.checked?'1':'0';save();updateLive()}else if(t.dataset.help){current().fields['help_'+t.dataset.help]=t.checked?'1':'0';save();updateLive()}else if(t.dataset.check){current().fields[t.dataset.check]=[...document.querySelectorAll(`[data-check="${t.dataset.check}"]:checked`)].map(x=>x.value);save();updateLive()}else if(t.dataset.field){if(/^goalPart[0-9]$/.test(t.dataset.field))pinAllocation();current().fields[t.dataset.field]=t.value;if(t.dataset.field==='assessmentMode'){delete current().fields.planIssue;save();render();$('diagnosis').scrollIntoView({block:'start'})}else{save();updateLive()}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.allocation){if(t.dataset.allocation==='reset')resetAllocation();else if(t.dataset.allocation==='undo')undoAllocation();else adoptExistingTargets()}else if(t.dataset.reference){restoreReference(t.dataset.reference)}else if(t.dataset.undo){undoReference(t.dataset.undo)}else if(t.dataset.stage){app.active=t.dataset.stage;save();render();window.scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.score||t.dataset.potential){const prop=t.dataset.score?'scores':'potential',id=t.dataset.score||t.dataset.potential;current()[prop][id]=Number(t.dataset.value);t.closest('.rate-buttons').querySelectorAll('[data-value]').forEach(b=>{const selected=b.dataset.value===t.dataset.value;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});save();updateLive()}else if(t.dataset.clear||t.dataset.pclear){delete current()[t.dataset.clear?'scores':'potential'][t.dataset.clear||t.dataset.pclear];t.closest('.rate-buttons').querySelectorAll('[data-value]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});save();updateLive()}else if(['generateTop','generateBottom'].includes(t.id))generate();else if(t.id==='printBtn')printReport();else if(t.id==='resetBtn')resetStage();else if(t.id==='exportBtn')exportData();else if(t.id==='importBtn')$('importFile').click();else if(t.id==='copyReport')copyReport();else if(t.id==='demoBtn')demo()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('文件过大');const data=JSON.parse(await file.text());if(!validBackup(data))throw new Error('文件格式不正确，或评分不在1—5分范围');if(!confirm('恢复备份会替换三学段当前记录。继续吗？'))return;app=data;save();render();toast('已恢复备份；原有评分和目标记录已保留。')}catch(err){toast('恢复失败：'+err.message)}finally{e.target.value=''}});
window.addEventListener('beforeprint',()=>{renderReport();buildPrintSnapshot();document.body.classList.toggle('print-full',$('printMode')?.value==='full')});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('其他窗口修改了记录。请先备份当前内容，再刷新查看。')});
render();if(storageAvailable)$('mobileSave').textContent='内容自动保存在本浏览器；换学生前请先备份。';

function potentialForm(){return `<div class="subhead">小学专项 · 兴趣与发展特点</div><p class="note">按孩子年龄和已有学习机会观察；这些表现用于安排后续培养，不用来认定智力或特殊招生资格。</p>${POTENTIAL.map(it=>`<div class="rating-item"><div class="rating-top"><b id="label-p-${it[0]}">${it[1]}</b><div class="rate-buttons" role="group" aria-labelledby="label-p-${it[0]}">${[1,2,3,4,5].map(n=>`<button data-potential="${it[0]}" data-value="${n}" class="${current().potential[it[0]]===n?'selected':''}" aria-pressed="${current().potential[it[0]]===n}">${n}</button>`).join('')}<button class="clear" data-pclear="${it[0]}">不了解</button></div></div><div class="anchors"><div><b>1分</b>${it[2]}</div><div><b>3分</b>${it[3]}</div><div><b>5分</b>${it[4]}</div></div></div>`).join('')}<div id="potentialResult" class="hint"></div>`}</script>
