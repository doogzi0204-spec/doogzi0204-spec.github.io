let app={version:1,active:'primary',stages:{primary:blank(),middle:blank(),high:blank()}};
let storageAvailable=true;
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(validBackup(p))app=p;else storageAvailable=false}}catch(e){storageAvailable=false}

const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>app.stages[app.active];const f=k=>current().fields[k]??'';const arr=k=>Array.isArray(f(k))?f(k):[];const num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):null;
function blank(){return {fields:{},scores:{},evidence:{},potential:{},potentialEvidence:{},reportGenerated:false}}
function validBackup(x){return !!(x&&x.version===1&&Object.keys(STAGES).includes(x.active)&&x.stages&&Object.keys(STAGES).every(k=>{const v=x.stages[k];return v&&['fields','scores','evidence','potential','potentialEvidence'].every(t=>v[t]&&typeof v[t]==='object'&&!Array.isArray(v[t]))&&Object.values(v.scores).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.values(v.potential).every(n=>Number.isInteger(n)&&n>=1&&n<=5)&&Object.entries(v.fields).every(([k,n])=>['paths','majors'].includes(k)?Array.isArray(n)&&n.every(t=>typeof t==='string'):typeof n==='string')&&Object.values(v.evidence).every(n=>typeof n==='string')&&Object.values(v.potentialEvidence).every(n=>typeof n==='string')}))}
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(app));storageAvailable=true;$('saveStatus').innerHTML='<span class="status-dot"></span>已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('mobileSave').textContent='已保存到本浏览器 · 三学段分别保存一份当前首面'}catch(e){storageAvailable=false;$('saveStatus').textContent='本地保存不可用 · 请导出备份';$('mobileSave').textContent='自动保存不可用，请先导出数据备份。'}}
function input(key,label,type='text',placeholder='',cls=''){return `<label class="field ${cls}"><span>${esc(label)}</span><input data-field="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(f(key))}" placeholder="${esc(placeholder)}"></label>`}
function area(key,label,placeholder='',cls='full'){return `<label class="field ${cls}"><span>${esc(label)}</span><textarea data-field="${key}" placeholder="${esc(placeholder)}">${esc(f(key))}</textarea></label>`}
function checks(key,label,options){return `<div class="field full"><span>${esc(label)}</span><div class="choices">${options.map(o=>`<label class="choice"><input data-check="${key}" type="checkbox" value="${esc(o)}" ${arr(key).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`}
function section(id,no,title,sub,body){return `<section id="${id}" class="card editor"><div class="section-head"><span class="section-no">${no}</span><div><h2>${title}</h2><p>${sub}</p></div></div>${body}</section>`}
function scoreTable(){const st=app.active;return `<div class="table-wrap"><table class="scorebook"><thead><tr><th>学科 / 计入</th><th>当前分</th><th>满分</th><th>目标分</th><th>目标差距</th><th>预计能减少的丢分</th><th>定位</th><th>主要卡在哪方面</th><th>成绩来自哪里 / 错因</th></tr></thead><tbody>${STAGES[st].subjects.map((s,i)=>`<tr><td><label class="small-label"><input type="checkbox" data-include="${i}" aria-label="计入${s}分数账" ${f('include'+i)==='0'?'':'checked'}> 计入</label>${st==='high'&&i>2?`<input aria-label="${s}名称" data-field="subjectName${i}" value="${esc(f('subjectName'+i)||s)}">`:s}</td>${['now','max','target'].map(k=>`<td><input aria-label="${s}${({now:'当前分',max:'满分',target:'目标分'})[k]}" data-field="${k}${i}" type="number" min="0" step="any" value="${esc(f(k+i))}"></td>`).join('')}<td id="gap${i}">—</td><td><input aria-label="${s}可回收分" type="number" min="0" step="any" data-field="recover${i}" value="${esc(f('recover'+i))}"></td><td><select aria-label="${s}定位" data-field="position${i}"><option value="">待判断</option>${['优势','稳定','短板'].map(o=>`<option ${f('position'+i)===o?'selected':''}>${o}</option>`).join('')}</select></td><td><select aria-label="${s}主要卡在哪方面" data-field="cause${i}"><option value="">待判断</option>${MODULES.map(m=>`<option value="${m.id}" ${f('cause'+i)===m.id?'selected':''}>${m.name}</option>`).join('')}</select></td><td><input aria-label="${s}成绩证据" data-field="subjectEvidence${i}" value="${esc(f('subjectEvidence'+i))}" placeholder="试卷、日期、失分归因"></td></tr>`).join('')}</tbody></table></div><p class="note">未参加本次考试 / 未开设的学科可取消“计入”，小计只汇总已勾选学科。* 可回收分由教务依据试卷估计，是当前分数中可改善失分的判断，不等同于目标差距；不得超过满分与当前分之差。分数须统一原始分 / 赋分、考试和满分口径。</p><div id="scoreAccount" class="hint"></div>`}
function potentialForm(){return `<div class="subhead">小学专项 · 高潜特征与发展类型</div><p class="note">按年龄与已有学习机会观察；高潜特征用于安排发展性观察，不是智力鉴定，也不构成特殊招生资格。</p>${POTENTIAL.map(it=>`<div class="rating-item"><div class="rating-top"><b id="label-p-${it[0]}">${it[1]}</b><div class="rate-buttons" role="group" aria-labelledby="label-p-${it[0]}">${[1,2,3,4,5].map(n=>`<button data-potential="${it[0]}" data-value="${n}" class="${current().potential[it[0]]===n?'selected':''}" aria-pressed="${current().potential[it[0]]===n}">${n}</button>`).join('')}<button class="clear" data-pclear="${it[0]}">待评</button></div></div><div class="anchors"><div><b>1分</b>${it[2]}</div><div><b>3分</b>${it[3]}</div><div><b>5分</b>${it[4]}</div></div><input class="evidence" aria-label="${it[1]}观察证据" data-pevidence="${it[0]}" value="${esc(current().potentialEvidence[it[0]]||'')}" placeholder="记录跨时间 / 跨场景观察、作品或具体事例"></div>`).join('')}<div class="fields" style="margin-top:16px">${select('potentialSource','高潜观察证据范围',['仅本次面谈 / 单一描述','两个及以上场景或时点的具体证据'])}${select('devConfirm','教务确认的发展类型',['基础稳定型','优秀学业型','单科突出型','高潜特征待验证','暂时无法判断'])}${area('devReason','发展类型确认依据 / 下一步观察')}</div><div class="hint" id="potentialResult"></div>`}
function demand(){if(f('goalDemand').includes('巩固'))return {target:3.2,label:'巩固达标',source:'当前阶段需求'};if(f('goalDemand').includes('稳步'))return {target:3.8,label:'稳步提升',source:'当前阶段需求'};if(f('goalDemand').includes('拔高'))return {target:4.3,label:'拔高突破',source:'当前阶段需求'};if(['清北','顶尖985','其他985'].includes(f('idealLevel')))return {target:4.3,label:'拔高突破',source:'由家庭理想大学层次暂估，请确认阶段需求'};return {target:3.8,label:'稳步提升',source:'需求未填，按中等需求暂估'}}
function scoreAccount(){let n=0,t=0,r=0,nc=0,tc=0,rc=0;const invalid=[],rows=[];STAGES[app.active].subjects.forEach((s,i)=>{if(f('include'+i)==='0')return;const a=num(f('now'+i)),b=num(f('target'+i)),c=num(f('max'+i)),d=num(f('recover'+i));const name=f('subjectName'+i)||s;const bad=[a,b,c,d].some(v=>v!==null&&v<0)||(c!==null&&((a!==null&&a>c)||(b!==null&&b>c)))||(d!==null&&c!==null&&a!==null&&d>c-a);if(bad)invalid.push(name);const gap=a!==null&&b!==null&&!bad?b-a:null;rows.push({i,name,now:a,target:b,max:c,recover:d,gap,cause:f('cause'+i),bad});if(!bad){if(a!==null){n+=a;nc++}if(b!==null){t+=b;tc++}if(d!==null){r+=d;rc++}}});return {n,t,r,nc,tc,rc,invalid,rows,all:rows.length>0&&rows.every(v=>v.now!==null&&v.target!==null&&v.max!==null&&!v.bad)}}
function rankCandidates(ms){const D=demand(),by=Object.fromEntries(ms.map(m=>[m.id,m]));const account=scoreAccount();const rec=Object.fromEntries(MODULES.map(m=>[m.id,0]));account.rows.forEach(row=>{if(!row.bad&&row.now!==null&&row.max!==null&&row.recover!==null&&rec[row.cause]!==undefined)rec[row.cause]+=row.recover});const recTotal=Object.values(rec).reduce((a,b)=>a+b,0);return ms.filter(m=>m.complete).map(m=>{let prereq=0;const notes=[];let blocked=false;const gap=Math.max(0,D.target-m.avg);if(m.id==='base'&&m.avg<3.5){prereq+=1.6;notes.push('基础是后续框架与思维的前置条件')}if(m.id==='frame'&&m.avg<3.5){if(by.base.complete&&by.base.avg>=3.5){prereq+=1.3;notes.push('基础较好而知识调用偏弱，框架更值得优先核查')}else{prereq+=.3;notes.push('需与基础漏洞区分，避免把前置问题归成框架问题')}}if(m.id==='manage'&&m.avg<3){prereq+=1.4;notes.push('执行不足可能削弱其他训练的落实')}if(m.id==='stable'&&m.avg<3&&by.base.complete&&by.base.avg>=3.5){prereq+=1.2;notes.push('基础较好但考试损耗明显，可优先验证执行流程')}if(m.id==='think'&&(!by.base.complete||!by.frame.complete||by.base.avg<3.5||by.frame.avg<3.5)){blocked=true;notes.push('前置基础 / 框架未达3.5或未评齐，列为后置候选')}const sp=f('space_'+m.id),space=sp.startsWith('较大')?1.2:sp.startsWith('有限')?.15:.65;const serious=Math.max(0,2.5-m.avg)*1.2;const lowWeight=Math.min(.8,m.lows.length*.2);const recovery=recTotal?1.2*rec[m.id]/recTotal:0;const value=gap*2+serious+prereq+space+lowWeight+recovery;notes.push('目标参考线'+D.target.toFixed(1)+'，模块差距'+gap.toFixed(2));notes.push(sp?'改善空间：'+sp:'改善空间未评，暂按中等');if(rec[m.id])notes.push('已归因的可回收分 '+rec[m.id].toFixed(1));if(m.lows.length)notes.push(m.lows.length+'个1—2分单项');return {...m,value,notes,blocked,spaceUnknown:!sp}}).filter(m=>m.avg<D.target||m.lows.length).sort((a,b)=>Number(a.blocked)-Number(b.blocked)||b.value-a.value)}
function potentialConclusion(){const v=POTENTIAL.map(x=>current().potential[x[0]]);const full=v.every(x=>x>=1&&x<=5);const ms=stats();const clues=POTENTIAL.filter(x=>current().potential[x[0]]>=4).map(x=>x[1]);const evidence=POTENTIAL.filter(x=>current().potential[x[0]]>=4&&String(current().potentialEvidence[x[0]]||'').trim()).length;let type='暂时无法判断';let reason='专项观察或核心模块未完成，先补充证据。';if(full){if(clues.length>=3){type='高潜特征待验证';reason='较高特征包括'+clues.join('、')+'。'+(f('potentialSource').startsWith('两个')&&evidence>=3?'已记录多场景线索，可安排持续探究与作品任务继续验证。':'跨时间、跨场景证据尚不足，不能仅凭一次面谈认定高潜。')}else if(STAGES.primary.subjects.some((s,i)=>f('position'+i)==='优势')){type='单科突出型线索';reason='存在教务标记的优势学科，应核对作品与同口径表现，兼顾其他基础。'}else if(ms.every(m=>m.complete&&m.avg>=3.8)){type='优秀学业型线索';reason='五大模块均较稳定，可在保留兴趣和休息的前提下适度增加挑战。'}else if(ms[0].complete&&ms[0].avg>=3){type='基础稳定型线索';reason='基础基本可用，优先建立阅读、表达、习惯和兴趣投入。'}else{reason='尚未形成稳定的类型证据，先关注基本学习体验与可改善项。'}}return {type,reason,confirmed:f('devConfirm'),confirmReason:f('devReason')}}
function printReport(){generate(false);buildPrintSnapshot();document.body.classList.toggle('print-full',$('printMode').value==='full');window.print()}
function resetStage(){if(!confirm('清空'+STAGES[app.active].label+'当前首面并开始新学生？请先导出需要保留的数据。其他学段不受影响。'))return;app.stages[app.active]=blank();save();render();window.scrollTo({top:0});toast('当前学段已清空')}

function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function copyReport(){if(!current().reportGenerated)generate(false);const text=$('reportRoot').innerText;try{await navigator.clipboard.writeText(text);toast('已复制家长版结论')}catch(e){download(new Blob([text],{type:'text/plain;charset=utf-8'}),(f('name')||'学生')+'_首面规划结论.txt');toast('浏览器限制剪贴板，已改为下载文字结论')}}
// V2: quick interview, plain Chinese, and issue-specific two-week actions.
const QUICK={base:[1,2],frame:[2,3],think:[0,2],stable:[0,2],manage:[2,4]};
const FRIENDLY={base:['基础知识','课本内容和简单题会不会'],frame:['综合运用','几个知识放在一起，会不会用'],think:['独立思考','题目换个样子，还会不会做'],stable:['考试表现','会做的题，考试能不能拿到分'],manage:['学习习惯','能不能按时开始、做完并订正']};
const QUESTIONS={
base:[['学过的内容，有没有明显没学会的地方？','课本中有很多内容不会，简单题也经常做不出','大部分学过，少数地方还不懂','能找出自己哪里不会，并及时补上'],['能不能用自己的话讲清楚知识？','只能背结论，一换问法就不会','常见问题能解释，问深一点就不清楚','能讲清为什么，还能举一个自己的例子'],['最近的简单题，能不能做对？','简单题经常错，而且老错在同一个地方','大部分能做对，偶尔仍有反复出现的错误','连续几次练习都很少在简单题上失分'],['过几天再问，学过的内容还记得吗？','今天会，过几天又像没学过','主要内容记得，部分词语、公式容易忘','隔几天仍能说出、用对，并主动复习'],['常见题的基本做法，用得熟吗？','每次做都要老师重新提醒','常见题会用，稍有变化就停住','能独立使用，还能解释什么时候这样做']],
frame:[['能说清这一章主要学了哪几件事吗？','学完只记得零散内容，说不出联系','能说出主要内容，但联系还不清楚','能把内容分组，并说明相互之间的联系'],['看到题，知道它主要在问什么吗？','不清楚题目在考什么，想到哪做哪','常见题能看出来，换个问法就拿不准','能说出题目在问什么、为什么这样解'],['做题时，能自己想到学过的方法吗？','学过，但一做题就想不到','熟悉的题能想到，稍复杂就要提示','不靠老师提醒，也能说出该用什么方法'],['几个知识放进同一道题，还会做吗？','每个小题单独会，放一起就不会','简单组合能做，稍复杂就容易乱','能把题拆成几步，组合学过的知识完成'],['做完几道类似题，会总结共同做法吗？','只看对错，下一次仍从头猜','老师带着能总结，自己总结不清楚','能说出共同做法，以及哪些题不能照搬']],
think:[['题目换个说法，能不能自己找办法？','一换说法就不会开始','熟悉题会做，换材料后要人提醒','能自己找到相同之处，并尝试解决'],['题目里的条件多了，还能理清吗？','条件稍多就混乱，没法往下做','简单的能分析，复杂时会漏条件','能逐条找条件，按顺序说明怎么做'],['老师讲过一题，换一道相似的新题会做吗？','原题会，换一道就不会','小变化能做，变化大了需要提示','能说明两题哪里相同、哪里不同，并自己做'],['遇到不会的题，能试着往前走几步吗？','很快放弃，等老师给答案','愿意试，但卡住后不知道换什么办法','能换一种办法试，并说明尝试的理由'],['长题目或长材料，能找到关键信息吗？','找不到重点，重要条件常漏掉','多数能找到，信息多时会漏','能圈出与问题有关的内容，并排除无关信息'],['做对以后，会不会再想一想原因？','只要答案对，很少再问为什么','老师问时能解释一部分','会主动比较不同做法，追问为什么和适用条件']],
stable:[['会做的题，会不会因为看漏、看错而丢分？','经常漏条件、看错要求或答错位置','平时大多能看清，考试紧张时仍会漏','能圈出关键要求，并在交卷前核对'],['答案能不能把该写的步骤写全？','经常只写答案，漏步骤或表达不清','简单题写得全，复杂题会漏要点','能按要求写清过程、单位和答题要点'],['考试能不能按时做完？','常在一道题上花太久，后面来不及','大多能做完，遇到难题就会打乱节奏','知道哪些先做、哪些回头做，还能留时间检查'],['卡住时，能不能先跳过？','一直耗在一道题，后面容易的题也没做','知道该跳过，有时还是舍不得停','能按约定时间跳题，做完其他题再回来'],['重要考试时，能否按平时的方法做？','一紧张就明显影响作答','普通考试还好，重要考试会乱节奏','紧张时也能停一下，再按既定步骤做'],['难度相近的几次考试，表现是否稳定？','分数或排名常大幅波动','大致在一个范围，仍有起伏','几次表现接近，能说清小幅变化的原因']],

};
MODULES.forEach(m=>{m.oldName=m.name;m.name=FRIENDLY[m.id][0];m.brief=FRIENDLY[m.id][1];m.items=QUESTIONS[m.id]});
const LABELS={quick:'快速首面 · 10个问题',full:'详细评估 · 30个问题','匹配':'通常能得到帮助','基本匹配':'大部分时候能得到帮助','部分不匹配':'有些地方缺少帮助','明显不匹配':'很难得到针对帮助','偏基础':'学校教得偏简单','适中':'大部分能跟上','偏难':'部分内容跟得吃力','明显超出当前能力':'很多内容跟不上',
'巩固达标 / 守住底线':'先把简单题和基本习惯做好','稳步提升 / 重点学校':'希望稳步提分，向目标学校靠近','拔高突破 / 顶尖目标':'基础较好，希望冲更高目标',
'较大：证据明确，资源到位':'能配合，也有老师支持','中等：可干预，需持续支持':'可以做，需要提醒和帮助','有限：周期 / 资源存在限制':'时间、配合度或资源有限',
'冲刺型：接受波动，保留备选':'愿意冲一冲，也接受结果有波动','稳健型：目标与确定性兼顾':'既争取好结果，也保留稳妥选择','稳定型：优先底线与确定性':'优先保证能接受的结果'};
function quickMode(){return f('assessmentMode')!=='full'}
function indices(m){return quickMode()?QUICK[m.id]:m.items.map((_,i)=>i)}
function display(v){return LABELS[v]||v}
function moduleFor(v){return MODULES.find(m=>m.id===v||m.name===v||m.oldName===v)}
function fold(title,body){return `<details class="optional"><summary>${title} <span>选填，点开再补</span></summary><div class="optional-body">${body}</div></details>`}
function select(key,label,options,cls=''){const list=[...options];if(f(key)&&!list.includes(f(key)))list.push(f(key));return `<label class="field ${cls}"><span>${esc(label)}</span><select data-field="${key}"><option value="">暂不清楚，可以先跳过</option>${list.map(o=>`<option value="${esc(o)}" ${f(key)===o?'selected':''}>${esc(display(o))}</option>`).join('')}</select></label>`}
function basicForm(){return `<div class="fields core-fields">${input('name','学生姓名','text','怎么称呼孩子？')}${select('grade','现在读几年级？',STAGES[app.active].grades)}${input('school','现在在哪所学校？')}${area('concern','这次最想解决什么？（一句话即可）','例如：数学简单题会，综合题不会；作业拖到很晚，需要反复催。')}</div>${fold('家庭和访谈信息',`<div class="fields">${input('interviewDate','面谈日期','date')}${input('teacher','负责老师')}${input('class','班级 / 班型')}${input('region','升学所在省市')}${select('contact','主要沟通人',['父亲','母亲','父母双方','其他监护人'])}${input('studentWish','孩子自己想达到什么目标？')}${input('interest','孩子喜欢什么、愿意长期做什么？')}${input('outside','现在还在上什么课？','text','科目和每周次数')}${input('budget','家里能投入多少时间 / 费用？')}${app.active==='high'?input('electives','选科组合'):''}${area('studentVoice','孩子自己的话','可以记录孩子的感受和希望获得的帮助。')}</div>`)}`}
function goalsForm(){const st=app.active;const target=st==='primary'?'初中':st==='middle'?'高中':'大学';return `<div class="fields">${st==='high'?input('normalUni','最希望考上哪所大学 / 哪个层次？','text','没有具体学校，可先填“本科”“211”等'):input('normalSchool','最希望考上哪所'+target+'？','text','暂不清楚也可以，先解决当前学习问题')}${select('goalDemand','这阶段先做到哪一步？',['巩固达标 / 守住底线','稳步提升 / 重点学校','拔高突破 / 顶尖目标'])}</div>${fold('理想、正常和保底目标',`<div class="fields">${st==='high'?'':input('idealSchool','理想'+target)+input('floorSchool','最低能接受的'+target)+input('nearGoal','未来1—2年希望达到什么状态？')}${select('idealLevel','理想大学层次',LEVELS)}${select('normalLevel','正常努力想争取的大学层次',LEVELS)}${select('floorLevel','最低能接受的大学层次',LEVELS)}${input('idealUni','理想大学 / 方向')}${st==='high'?'':input('normalUni','正常目标大学 / 方向')}${input('floorUni','保底大学 / 方向')}${input('schoolRequirement','目标学校大约要求什么成绩？','text','写明年份和信息来源，没有资料先留空')}${area('tierReason','这些目标是怎么定的？','参考近年排名、学校要求和孩子意愿，不凭这次评分预测录取。')}</div>`) }${fold('专业、城市、升学方式和家庭选择',`<div class="fields">${checks('majors','可能感兴趣的专业方向',['数学 / 基础科学','计算机 / 人工智能','工程技术','医学 / 生命科学','经济 / 金融','法学 / 社会科学','人文 / 语言','师范 / 教育','艺术 / 设计','体育','暂无倾向'])}${input('majorSpecific','特别想学 / 不接受的专业')}${input('cities','喜欢哪些城市？')}${select('regionFlex','城市能不能调整？',['全国可考虑','优先本省 / 本地','优先一线 / 新一线','仅接受指定城市','尚未讨论'])}${select('priority','学校、专业、城市，哪个更看重？',['学校 > 专业 > 城市','学校 > 城市 > 专业','专业 > 学校 > 城市','专业 > 城市 > 学校','城市 > 学校 > 专业','城市 > 专业 > 学校','尚未达成一致'])}${select('risk','选择时更想冲一冲，还是稳一点？',['冲刺型：接受波动，保留备选','稳健型：目标与确定性兼顾','稳定型：优先底线与确定性','尚未达成一致'])}${select('adjustment','能否接受专业调整？',['接受调剂或调整方向','仅接受指定专业范围','不接受调剂','视院校层次决定','尚未讨论'])}${checks('paths','想了解的升学方式',['普通高考','强基计划','学科竞赛','少年班 / 拔尖项目','综合评价','港澳高校','国际方向','艺术 / 体育','其他','尚未明确'])}${input('pathMain','主要考虑哪条路？')}${input('pathBackup','备选考虑哪条路？')}${input('pathEvidence','是否已查过具体要求？','text','地区、年份、选科和材料要求')}${select('schoolPath','小学 / 初中当前考虑的升学方式',['适应校内 / 就近升学','优质初中平台准备','普通中考升学','指标到校 / 校额等（待核验）','贯通 / 拔尖项目（待核验）','国际方向探索','暂未明确'])}${area('constraints','还有哪些家里必须考虑的条件？','如通勤、寄宿、费用、身体状况和家长孩子的想法差异。')}</div><p class="note">这些选项只是记录意向。实际能不能走，要另查当年当地的招生要求。</p>`)}`}
function schoolForm(){return `<div class="fields">${select('difficulty','学校教的内容，孩子跟得上吗？',['偏基础','适中','偏难','明显超出当前能力'])}${select('match','孩子不会的地方，校内能得到帮助吗？',['匹配','基本匹配','部分不匹配','明显不匹配','信息不足'])}</div><p class="note">第一项看“听不听得懂”，第二项看“不会时有没有人帮”。不清楚可以先跳过。</p>${fold('排名、作业和学校资源',`<div class="fields">${input('rank','当前年级排名','number')}${input('cohort','年级总人数','number')}${input('classRank','班级排名','number')}${input('workload','每天作业大约做多久？')}${input('progress','现在学校学到 / 复习到哪里？')}${input('examFrequency','大约多久考一次？')}${input('schoolLevel','学校主要特点')}${input('classPosition','所在班级的主要特点')}${area('resourcePlus','学校能提供哪些帮助？')}${area('resourceLimit','目前学校帮不上哪些地方？')}${area('schoolHistory','同校、相近排名的学生往年去了哪里？','有可靠资料再填写，注明年份和来源。')}</div>`)}`}
function ratingModule(m){const ids=indices(m);return `<div class="simple-module"><div class="simple-module-head"><div><h3>${m.name}</h3><p>${m.brief}</p></div><span id="summary-${m.id}" class="module-summary"></span></div>${ids.map(i=>{const it=m.items[i],id=m.id+'_'+i;return `<div class="rating-item"><div class="rating-top"><b class="rating-name" id="label-${id}">${it[0]}</b><div class="rate-buttons" role="group" aria-labelledby="label-${id}">${[1,2,3,4,5].map(n=>`<button data-score="${id}" data-value="${n}" aria-pressed="${current().scores[id]===n}" class="${current().scores[id]===n?'selected':''}" title="${n}分：${esc(n===1?it[1]:n===3?it[2]:n===5?it[3]:n===2?'比1分好一些，但还没达到3分':'比3分更稳定，还没有达到5分')}">${n}</button>`).join('')}<button class="clear" data-clear="${id}" title="还不了解，暂不评分">不了解</button></div></div><div class="anchors"><div><b>1分</b>${it[1]}</div><div><b>3分</b>${it[2]}</div><div><b>5分</b>${it[3]}</div></div>${!quickMode()?`<input class="evidence" data-evidence="${id}" aria-label="${m.name}·${it[0]}的例子" value="${esc(current().evidence[id]||'')}" placeholder="选填：一句话举例，或写试卷 / 作业上的表现">`:''}</div>`}).join('')}${fold('补一个例子，或说明配合条件',`<div class="fields">${area('moduleExample_'+m.id,'最近有没有一件具体的事能说明？','一句话即可；没有把握先留空。')}${select('space_'+m.id,'这件事，近期有没有条件去练？',['较大：证据明确，资源到位','中等：可干预，需持续支持','有限：周期 / 资源存在限制'])}${input('support_'+m.id,'具体有什么帮助或困难？')}</div>`)}</div>`}
function diagnosisForm(){return `<div class="focus-line"><div class="fields">${input('focusSubject','本次先看哪一科？','text','例如：数学、英语、语文；建议先选一科')}${select('assessmentMode','本次怎么了解学习情况？',['quick','full'])}</div><p class="note">默认只答10个问题。1分＝经常做不到，3分＝通常能做到，5分＝自己能稳定做好；2分、4分介于两档之间。不了解就留空，不需要每项都写说明。切换到详细评估可查看全部30项；切换不会清空已有评分，均分按当前显示的问题计算。</p></div><div id="liveMetrics" class="live-metrics"></div>${MODULES.map(ratingModule).join('')}${fold('补充成绩 / 高中目标差距',`<div class="fields">${input('examName','成绩来自哪次考试？')}${input('recentRanks','最近几次分数 / 排名变化')}${input('natural','照目前情况，大约能考到哪类学校？','text','有成绩和排名依据再判断')}${input('naturalSource','这个判断参考了什么？')}${select('gapStatus','与家庭目标相比怎么样？',['高于正常目标','基本匹配','略低于正常目标','明显低于正常目标','信息不足'])}${input('remaining','距离关键考试大约还有多久？')}${area('gapNotes','还有哪些具体问题？','少写抽象词，多写孩子做了什么、哪一步没做到。')}</div><div class="subhead">各科分数：有资料再填</div>${scoreTable()}`)}${app.active==='primary'?fold('小学补充观察：兴趣和发展特点',potentialForm()):''}`}
function stats(){return MODULES.map(m=>{const ids=indices(m);const vals=m.items.map((_,i)=>ids.includes(i)?current().scores[m.id+'_'+i]:undefined);const filled=vals.filter(n=>n>=1&&n<=5);return {...m,values:vals,indices:ids,required:ids.length,count:filled.length,complete:filled.length===ids.length,avg:filled.length?filled.reduce((a,b)=>a+b,0)/filled.length:null,lows:vals.map((n,i)=>({n,i,name:m.items[i][0]})).filter(v=>v.n&&v.n<=2),evidenceCount:vals.filter((n,i)=>n&&String(current().evidence[m.id+'_'+i]||'').trim()).length}})}
function band(a){return a===null?'还没了解':a<2?'需要重点帮助':a<3?'目前做得较少':a<3.8?'大多能做到':a<4.5?'做得比较稳定':'能独立做好'}
function metricsHTML(ms){return ms.map(m=>`<div class="metric ${m.avg!==null&&m.avg<3?'low':''}"><span>${m.name}</span><b>${m.avg===null?'—':m.avg.toFixed(1)}</b><span>${m.count}/${m.required}项${m.complete?'':' · 待了解'}</span></div>`).join('')}
function explain(m){if(m.avg===null)return '这方面还没了解，先不下判断。';const low=m.values.map((n,i)=>({n,i})).filter(x=>x.n).sort((a,b)=>a.n-b.n)[0];if(m.lows.length)return '目前要多帮一把，具体先看：'+m.items[low.i][0];const sentences={base:'课本和简单题大多能应对，继续留意反复错的地方。',frame:'能运用学过的内容，继续练习自己说清解题步骤。',think:'能尝试新题，适合在现有基础上逐步增加变化。',stable:'考试时大多能把会的做出来，继续保持检查习惯。',manage:'明确任务后通常能完成，逐步减少催促。'};return m.avg>=4?'这方面目前比较稳定，保持已有做法。':sentences[m.id]}
function rootHypothesis(ms){const b=Object.fromEntries(ms.map(m=>[m.id,m]));const lines=[];if(b.base.complete&&b.base.avg<3)lines.push('先看看是不是课本内容还没真正懂。简单题没稳住时，直接增加难题可能更吃力。');if(b.base.complete&&b.frame.complete&&b.base.avg>=3.5&&b.frame.avg<3)lines.push('简单题会做，几个知识放在一起却做不出，可能是还不会自己找方法、分步骤。先让孩子边做边说思路。');if(b.think.complete&&b.base.complete&&b.frame.complete&&b.think.avg<3.5&&b.base.avg>=3.5&&b.frame.avg>=3.5)lines.push('熟悉题能做，题目换个样子就卡住，可能是练过的做法还不会换着用。可以从“原题改一个条件”开始。');if(b.stable.complete&&b.base.complete&&b.stable.avg<3&&b.base.avg>=3.5)lines.push('平时会，考试丢分，先对照试卷看看是看漏了、没写全，还是来不及做，分开处理。');if(b.manage.complete&&b.manage.avg<3)lines.push('如果任务经常没落实，先把每天的量缩小、完成时间说清楚，再观察其他训练能不能坚持。');if(!lines.length)lines.push('目前还不能确定一个主要原因。先从已记录的具体困难中选一件，练两周再看变化。');return lines.slice(0,2)}
function gaps(ms){const a=[];if(!f('name').trim())a.push('学生姓名');if(!f('grade'))a.push('年级');ms.forEach(m=>{if(!m.complete)a.push(m.name+'还有'+(m.required-m.count)+'个问题未了解')});return a}

stable:[

['把会的步骤写全','请老师从最近试卷选1道“思路会但写漏了”的题，标出缺失要点；孩子盖住示范重新写，再照老师列的3个检查点核对。','换1道相似题，检查同样的步骤、单位或要点是否还漏。','每次先盯一种遗漏，如单位或因果解释，别同时要求全部改完。'],
['练习按时做完一小组题','请老师选5道孩子会做的题，先做一次记录用时，再约定一个合理总时间和跳题提醒。第二次到提醒点就先做下一题，最后再回来。','比较两次完成题数、卡题时间和会做却没做的题数；第一轮不强求提速。','频繁超时就先减少题量或降低难度，检查是否其实还不会。'],
['给卡题设一个停下来的提醒','选一小组已学题，和老师约定单题卡住多久先跳过。孩子在卡题旁画星，继续做容易的题，最后统一回看。','记录是否执行了跳题、是否保住后面会做的题。','舍不得跳时，先在练习中体验“先拿容易分”，再带入考试。'],
['紧张时也有一个固定动作','用一次小测练习：开始前慢呼吸几次、看一遍题量、先做一道有把握的题。卡住时停一下，再按约定跳题。','记录能否执行这几个动作，以及紧张后能否重新开始。','如果压力持续影响睡眠、上学或生活，先与家长和学校沟通支持，不只增加训练。'],
['弄清每次波动到底丢在哪里','拿最近2次难度相近的试卷，各挑出3处失分，分别标成“不会、看漏、没写全、没时间”。只先处理出现最多的一类。','下一次相近难度练测，比较这一类失分是否减少，而不是只比较总分。','两次试卷难度或满分不同，就先不直接比较总分。']
],
manage:[
['把大目标改成今天一件小事','每天只写一件最重要且能完成的任务，如“独立做3题并订正”。写清几点开始、做到什么算完成，完成后打勾。','一周后看7天中完成几天，孩子能否说清自己在练什么。','连续做不完时先减量，不额外叠加更多目标。'],
['每天先安排两件能做完的事','开始前列2件重要任务，估计各需多久，把较难的一件放在精神较好的时段；结束后核对实际用时。','一周后看计划是否过量，哪件总被拖到最后，再调整顺序。','总排得太多，就只保留学校任务和一项短训练。'],
['先把“说了要做”变成“按时做完”','每天只约定2个小任务，写清开始时间和完成标准。到时间先做5分钟；完成后由孩子打勾，家长只在约定节点提醒一次。','连续记录7天：完成几天、需要提醒几次。第2周比较是否更容易自己开始。','连续3天完不成，先把任务减半，并问清是不会做、量太大还是不愿开始。'],
['找到作业时间花在哪里','先观察2天：只记录开始、结束和中途被打断的次数。再安排一个不被打断的学习小段，手机放远，结束后休息。','比较同类作业的完成时间与打断次数，不拿不同任务硬比速度。','小段仍坐不住就缩短时间，先争取完成一小段。'],
['错题隔几天再做一次','每次只选1—2道反复错的题。孩子先用一句话说错因，盖住答案重新做；第2天、第7天各重做一次，并补1道同类新题。','第7天不看答案检查，记录是否独立做对、同类新题是否也会。','仍错在同一步时请老师重讲那一步，先别抄更多错题。'],
['考完只选一个问题来改','从试卷中选3道失分题，孩子说清分别为什么错；挑最常见的一类，写出下周一个具体动作，其他问题先记录。','下次练测核对这个动作是否做了、同类失分是否减少。','说“粗心”时继续追问：到底是没看见哪句话、漏写哪一步？'],
['提问时先说自己卡在哪里','遇到不会的题，孩子先写“我知道什么、试过什么、卡在哪一步”，再问老师；听完以后盖住讲解自己做一次。','观察两周后能否提出具体问题，得到帮助后能否独立重做。','完全没思路时允许先说“第一步不会”，由老师给一个小提示。'],
['让孩子自己选一项补练','每天从两项短任务中让孩子选一项，约定开始时间；成人只核对约定，不在开始前反复催促。','一周后看主动开始的次数、是否完成自己选的任务。','两项都不愿选时，先沟通困难和兴趣，再降低任务量。']
]};
function subjectTip(){const s=f('focusSubject');if(s.includes('语文'))return '语文可用阅读题：先找原文依据，再说理由；有明确要求时补齐答题要点。';if(s.includes('英语'))return '英语可用阅读或语法题：先找题干关键词和对应句，再解释为什么选这个答案。';if(s.includes('物理')||s.includes('化学'))return '理科可先列已知条件、所求量和单位，再写每一步的依据。';if(s.includes('数学'))return '数学可先写“已知、所求、第一步用什么”，不急着算到底。';return '请任课老师选近期学过、难度相近的题。不同学科可用口述、书写或实际操作完成。'}
function issueOptions(ms){return ms.flatMap(m=>m.values.map((n,i)=>n?{id:m.id+'_'+i,m,i,n}:null).filter(Boolean))}
function chosenVariable(ms){const custom=moduleFor(f('confirmed'));if(custom&&f('confirmReason').trim()&&ms.find(m=>m.id===custom.id).complete)return {m:ms.find(m=>m.id===custom.id),confirmed:true,reason:f('confirmReason')};const ranks=rankCandidates(ms),top=ranks.find(m=>!m.blocked);return {m:top||null,confirmed:false,reason:top?plainReason(top,ms):'先补充了解，再选一件最值得练的事。'}}
function plainReason(m,ms){const b=Object.fromEntries(ms.map(x=>[x.id,x]));if(m.id==='base')return '先把学过的内容和简单题做稳，后面的综合题才更容易跟上。';if(m.id==='frame')return b.base.avg>=3.5?'简单题相对能做，主要卡在“自己找方法、把几步连起来”，先练这一件更有针对性。':'先从把题拆成小步开始，同时检查拆开后的小题是否真的会。';if(m.id==='think')return '基础和常见综合题相对能做，再用小变化的新题练习自己找办法。';if(m.id==='stable')return '先把本来会做的题做出来，看看能否少看漏、少写漏、少留空。';return '其他训练要先做得下去。先把每天约定的小任务落实，才有机会看见变化。'}
function selectedPlan(ms){const opts=issueOptions(ms),manual=opts.find(o=>o.id===f('planIssue'));let chosen=chosenVariable(ms);let issue=manual;if(!issue&&chosen.m)issue=opts.filter(o=>o.m.id===chosen.m.id).sort((a,b)=>a.n-b.n||a.i-b.i)[0];if(!issue)return null;const [title,steps,check,adjust]=STEPS[issue.m.id][issue.i];const minutes=app.active==='primary'?'8—12':app.active==='middle'?'15':'15—20';const sessions=issue.m.id==='manage'?'每天一次':issue.m.id==='stable'?'每周两次':'每周三次';return {...issue,title,steps,check,adjust,frequency:sessions+'，每次约'+minutes+'分钟；从现有作业中选题，尽量不额外加量。',reason:manual?'老师本次选中了这个问题。'+(chosen.m&&chosen.m.id!==issue.m.id?' 自动建议优先关注'+chosen.m.name+'；如果先练这里，请说明原因。':' '+plainReason(issue.m,ms)):plainReason(issue.m,ms),manual:!!manual,scope:opts.length}} 
function actionHTML(p,report=false){if(!p)return '<div class="hint">先回答学习情况中的问题，页面就会给出对应练法。不了解的项目可以留空。</div>';return `<div class="action-card ${report?'report-action':''}"><div class="eyebrow">先练这一件事${p.manual?' · 老师选择':''}</div><h3>${esc(p.title)}${f('focusSubject')?' · '+esc(f('focusSubject')):''}</h3><p>${esc(p.reason)}</p><div class="action-step"><b>① 每次怎么做</b><p>${esc(p.steps)}</p><p class="example-line">${esc(subjectTip())}</p></div><div class="action-step"><b>② 做多少，谁来帮</b><p>${esc(p.frequency)}</p><p>建议分工：孩子负责自己试和留下记录；任课老师负责选题、给一个小提示，每周检查一次；家长${app.active==='primary'?'在约定时间提醒，并鼓励孩子讲给自己听':'只核对约定是否完成，尽量不反复催促'}；教务在约定日期看记录。</p></div><div class="action-step"><b>③ 两周后怎么看有没有进步</b><p>${esc(p.check)}</p><p>第一次先如实记录，后面用难度相近的新题比较。${esc(p.adjust)}</p></div></div>`}
function planningForm(){return `<div id="insights"></div><div class="subhead">两周行动清单 · 系统先给，老师可调整</div><div id="actionPlan"></div><div class="fields" style="margin-top:18px"><label class="field full"><span>想先练另一件事？可从已回答的问题中选</span><select data-field="planIssue" id="planIssue"><option value="">采用页面建议</option></select></label></div>${fold('调整计划、时间和分工',`<div class="fields">${input('reviewDate','哪天一起看看效果？','date')}${input('phaseGoal','想达到的具体变化','text','例如：同类3道题中，能自己开始2道；不是承诺提分')}${input('owner','谁来帮助孩子？','text','例如：数学老师选题；妈妈只提醒一次；教务两周后检查')}${area('phaseActions','把练法改得更适合这个孩子','填写后会作为“老师补充安排”进入家长报告。')}${area('confirmReason','如果调整了页面建议，为什么？')}${input('nextExam','下次考试想争取的分数 / 排名')}${area('keep','哪些已有做法继续保持？')}${area('defer','哪些问题这阶段先不加量？')}${area('parentNote','与家长、孩子的补充约定')}</div>`) }${fold('给教务看的详细判断依据',`<div id="technicalNotes"></div><p class="note">旧版术语对应：基础＝课本与简单题；框架＝把学过的知识连起来用；思维突破＝新题自己想办法；稳定发挥＝把会做的题考出来；学习管理＝开始、完成、订正和复习。所谓“第一变量”，就是这两周先改变的一件事。</p><p class="note">快速首面只选取每类2个代表性问题，结论仅作初步方向；详细评估使用全部30项。空白不当成0分，也不自动补3分。先看低项与前后关系，再结合目标和能否坚持练习安排顺序；不是简单选择最低分。无论哪种模式，都要用实际练习记录验证。</p>`)}`}
function strengthSummaries(ms){const words={base:'课本内容和简单题做得相对稳定，可以保留现在有效的学习做法。',frame:'多数情况下能自己想到方法，把学过的内容连起来用。',think:'题目有所变化时，仍愿意尝试，并能自己想出一些办法。',stable:'会做的题较少因为看漏或来不及而丢分，可以保持已有检查习惯。',manage:'多数约定任务能完成，能做订正和复习，值得继续保持。'};return ms.filter(m=>m.complete&&m.avg>=3.8&&!m.lows.length).map(m=>words[m.id]).slice(0,2)}
function insightsHTML(ms){const opts=issueOptions(ms),strengths=strengthSummaries(ms),low=opts.filter(x=>x.n<=2).sort((a,b)=>a.n-b.n).slice(0,3);return `<div class="summary-grid"><div class="insight"><h3>孩子已经做得不错的地方</h3>${strengths.length?strengths.map(x=>'<p>'+esc(x)+'</p>').join(''):'<p>先看看孩子能自己完成哪些事；还没有足够记录时，不急着下结论。</p>'}</div><div class="insight"><h3>目前最需要帮助的地方</h3>${low.length?low.map(x=>'<p>'+esc(STEPS[x.m.id][x.i][0])+'</p>').join(''):'<p>目前没有记录到经常做不到的项目。仍可结合家长诉求和具体试卷，选一个小目标。</p>'}</div><div class="insight" style="grid-column:1/-1"><h3>这些表现，可能是怎么回事？</h3>${rootHypothesis(ms).map(s=>'<p>'+esc(s)+'</p>').join('')}<p class="small-label">这是根据本次回答作出的初步判断，先练两周再验证。</p></div></div>`}
function updateLive(){const ms=stats(),total=ms.reduce((a,m)=>a+m.required,0),count=ms.reduce((a,m)=>a+m.count,0);$('progressText').textContent='已了解 '+count+' / '+total+' 个问题';$('progressBar').style.width=(count/total*100)+'%';$('liveMetrics').innerHTML=metricsHTML(ms);ms.forEach(m=>{const el=$('summary-'+m.id);if(el)el.textContent=(m.avg===null?'待了解':m.avg.toFixed(1)+'分')+' · '+m.count+'/'+m.required});const ac=scoreAccount();STAGES[app.active].subjects.forEach((_,i)=>{if($('gap'+i))$('gap'+i).textContent='不计入'});ac.rows.forEach(r=>{if($('gap'+r.i))$('gap'+r.i).textContent=r.bad?'请核对':r.gap===null?'—':(r.gap>0?'+':'')+r.gap.toFixed(1)});if($('scoreAccount'))$('scoreAccount').textContent=ac.invalid.length?'请核对 '+ac.invalid.join('、')+'：分数不能小于0，或高于满分。':ac.all?'当前合计 '+ac.n.toFixed(1)+'分；目标合计 '+ac.t.toFixed(1)+'分；相差 '+(ac.t-ac.n).toFixed(1)+'分。':'已填成绩仅作部分记录；没有完整成绩也能先做学习规划。';$('insights').innerHTML=insightsHTML(ms);$('actionPlan').innerHTML=actionHTML(selectedPlan(ms));const sel=$('planIssue');const selected=f('planIssue');const optionHTML='<option value="">采用页面建议</option>'+issueOptions(ms).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.m.name+' · '+x.m.items[x.i][0]+'（'+x.n+'分）')}</option>`).join('');if(sel)sel.innerHTML=optionHTML;const ranks=rankCandidates(ms);$('technicalNotes').innerHTML='<p>本次使用'+(quickMode()?'快速首面（10项）':'详细评估（30项）')+'。已填'+count+'项，未填'+(total-count)+'项。五类平均分分别是：'+ms.map(m=>m.name+' '+(m.avg===null?'待了解':m.avg.toFixed(2))).join('；')+'。</p>'+ranks.slice(0,3).map(m=>'<p>'+m.name+'：'+esc(plainReason(m,ms))+(m.blocked?' 先补基础和综合运用，再安排这类训练。':'')+'</p>').join('');if($('potentialResult')){const p=potentialConclusion();$('potentialResult').textContent='可以继续观察的方向：'+p.type+'。'+p.reason}if(current().reportGenerated)renderReport()}
function reviewDay(){if(f('reviewDate'))return f('reviewDate');const d=new Date();d.setDate(d.getDate()+14);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function reportExtraGoals(){const rows=[];const st=app.active;[['ideal','理想目标'],['normal','正常目标'],['floor','最低能接受的目标']].forEach(([k,l])=>{const values=[st!=='high'?f(k+'School'):'',f(k+'Uni'),f(k+'Level')].filter(Boolean);if(values.length)rows.push(l+'：'+[...new Set(values)].join(' / '))});const details=[arr('majors').length?'感兴趣的方向：'+arr('majors').join('、'):'',f('majorSpecific')?'专业想法：'+f('majorSpecific'):'',f('cities')?'城市偏好：'+f('cities'):'',f('priority')?'选择顺序：'+f('priority'):'',f('risk')?'家庭想法：'+display(f('risk')):'',arr('paths').length?'关注的升学方式：'+arr('paths').join('、'):'',f('pathMain')?'主要考虑：'+f('pathMain'):'',f('pathBackup')?'备选：'+f('pathBackup'):'',f('constraints')?'还需考虑：'+f('constraints'):''].filter(Boolean);return [...rows,...details].map(t=>'<p>'+esc(t)+'</p>').join('')}
function renderReport(){const ms=stats(),p=selectedPlan(ms),missing=gaps(ms),count=ms.reduce((a,m)=>a+m.count,0),total=ms.reduce((a,m)=>a+m.required,0);const opts=issueOptions(ms);const plus=strengthSummaries(ms),low=opts.filter(x=>x.n<=2).sort((a,b)=>a.n-b.n).slice(0,3);const ac=scoreAccount();const st=STAGES[app.active];$('reportRoot').innerHTML=`<article class="report"><div class="report-header"><img class="report-logo" src="${MEIBO_LOGO}" alt="美博教育 Logo"><div class="eyebrow">美博教育 · 学生首面规划</div><h2>${esc(f('name')||'孩子')}的两周学习安排</h2><p class="meta">${esc([f('grade'),f('school'),f('teacher')?'负责老师：'+f('teacher'):''].filter(Boolean).join(' · '))}　${esc(f('interviewDate')||localDate())}</p><p class="meta">${quickMode()?'快速首面 · 初步了解':'详细评估'}，已了解 ${count}/${total} 项。${missing.length?'部分信息尚不清楚，下面只根据已回答的内容安排。':''}</p></div><h3>1. 这次先解决什么</h3>${f('concern')?'<p>本次最关心：'+esc(f('concern'))+'</p>':''}<p>${app.active==='primary'?'小学阶段先关注基本学习习惯、阅读表达和兴趣，保留未来选择。':app.active==='middle'?'初中阶段把目标高中与眼前的学习困难联系起来，一步步改善。':'高中阶段结合目标大学和最近成绩，先找值得投入的具体问题。'}${f('focusSubject')?' 本次先关注'+esc(f('focusSubject'))+'。':''}</p>${reportExtraGoals()}${f('natural')?'<p>目前成绩大约能对应的学校：'+esc(f('natural'))+'。'+(f('naturalSource')?'参考资料：'+esc(f('naturalSource'))+'。':'此判断的成绩或排名依据还需补充。')+'</p>':''}${f('resourceLimit')?'<p>学校中还需要补充的帮助：'+esc(f('resourceLimit'))+'</p>':''}<h3>2. 孩子现在哪些做得好，哪些需要帮忙</h3>${plus.length?'<p><b>值得保持：</b>'+plus.map(x=>esc(x)).join(' ')+'</p>':'<p>优势还需要多观察，先保留孩子已经能自己完成的做法。</p>'}${low.length?'<p><b>需要帮助：</b>'+low.map(x=>esc(STEPS[x.m.id][x.i][0])).join('；')+'</p>':''}<p>${esc(rootHypothesis(ms).join(' '))} 先用接下来的学习记录来检验，不给孩子贴固定标签。</p><table class="compact-metrics"><thead><tr>${ms.map(m=>'<th>'+m.name+'</th>').join('')}</tr></thead><tbody><tr>${ms.map(m=>'<td>'+(m.avg===null?'还不了解':m.avg.toFixed(1)+'分 · '+band(m.avg))+'</td>').join('')}</tr></tbody></table><h3>3. 接下来两周，具体这样做</h3>${actionHTML(p,true)}${f('phaseGoal')?'<p><b>老师与孩子约定的目标：</b>'+esc(f('phaseGoal'))+'</p>':''}${f('phaseActions')?'<p class="preline"><b>老师补充安排：</b>'+esc(f('phaseActions'))+'</p>':''}${f('owner')?'<p><b>本次明确分工：</b>'+esc(f('owner'))+'</p>':''}${f('confirmReason')?'<p><b>老师调整依据：</b>'+esc(f('confirmReason'))+'</p>':''}${app.active==='primary'&&Object.keys(current().potential).length?'<h3>小学的兴趣和发展观察</h3><p>'+esc(potentialConclusion().type+'。'+potentialConclusion().reason)+'</p>':''}${ac.nc?`<h3>已提供的成绩记录</h3><p>${esc(f('examName')||'考试名称待补充')}。${ac.all?'当前合计 '+ac.n.toFixed(1)+'，目标合计 '+ac.t.toFixed(1)+'；相差 '+(ac.t-ac.n).toFixed(1)+'分。':'目前只有部分学科记录，不据此推算总分。'}${ac.invalid.length?'有分数需要核对：'+esc(ac.invalid.join('、')):''}</p><table><thead><tr><th>学科</th><th>现在 / 满分</th><th>想达到</th></tr></thead><tbody>${ac.rows.filter(r=>r.now!==null||r.target!==null).map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+(r.bad?'请核对':(r.now??'—')+' / '+(r.max??'—'))+'</td><td>'+(r.bad?'请核对':r.target??'—')+'</td></tr>').join('')}</tbody></table>`:''}<h3>4. 什么时候一起看效果</h3><p><b>${f('reviewDate')?'已约定':'建议'}：${esc(reviewDay())}</b>。带上第一次与最近一次的练习，看看做对多少、需要提醒多少、哪一步更容易了。有效就继续；没变化就先减量、降难度或请老师重新判断原因。</p>${f('keep')?'<p>继续保持：'+esc(f('keep'))+'</p>':''}${f('defer')?'<p>这阶段先不加量：'+esc(f('defer'))+'</p>':''}${f('nextExam')?'<p>下次考试希望争取：'+esc(f('nextExam'))+'</p>':''}${f('parentNote')?'<p class="preline">补充约定：'+esc(f('parentNote'))+'</p>':''}${f('studentVoice')?'<p>孩子自己的想法：'+esc(f('studentVoice'))+'</p>':''}<div class="report-footer">本记录根据本次回答形成，${quickMode()?'只了解了10个代表性问题，不能代替完整评估。':'仍需用实际试卷和学习记录验证。'} 练习安排是起步建议，不承诺提高固定分数；招生条件需另行核对。填写内容只保存在当前浏览器，换设备前请导出备份。</div></article>`}
function buildPrintSnapshot(){const ms=stats();const labels=new Map();document.querySelectorAll('[data-field]').forEach(el=>{if(el.dataset.field==='planIssue')return;const label=el.closest('.field')?.querySelector('span')?.textContent||el.getAttribute('aria-label')||el.dataset.field;if(el.value)labels.set(el.dataset.field,{label,value:el.tagName==='SELECT'?(el.options[el.selectedIndex]?.text||el.value):el.value})});$('printSnapshot').innerHTML='<h2>首面填写记录</h2>'+[...labels.values()].map(x=>'<div class="snapshot-field"><b>'+esc(x.label)+'：</b>'+esc(x.value)+'</div>').join('')+['paths','majors'].filter(k=>arr(k).length).map(k=>'<div class="snapshot-field">'+(k==='paths'?'关注的升学方式':'感兴趣的专业')+'：'+esc(arr(k).join('、'))+'</div>').join('')+'<h3>本次评分与例子</h3><p>本次使用'+(quickMode()?'10题快速首面':'30项详细评估')+'；未评项目保持空白。</p>'+ms.map(m=>'<h3>'+m.name+'</h3><table><thead><tr><th>问题</th><th style="width:12%">评分</th><th>例子</th></tr></thead><tbody>'+m.indices.map(i=>'<tr><td>'+esc(m.items[i][0])+'</td><td>'+(m.values[i]||'不了解')+'</td><td>'+esc(current().evidence[m.id+'_'+i]||f('moduleExample_'+m.id)||'未补充')+'</td></tr>').join('')+'</tbody></table>').join('');if(app.active==='primary'&&Object.keys(current().potential).length)$('printSnapshot').innerHTML+='<h3>小学发展特点</h3>'+POTENTIAL.map(it=>'<div class="snapshot-field">'+it[1]+'：'+(current().potential[it[0]]||'不了解')+'；例子：'+esc(current().potentialEvidence[it[0]]||'未补充')+'</div>').join('')}
function generate(scroll=true){current().reportGenerated=true;renderReport();save();if(scroll)$('result').scrollIntoView({behavior:'smooth',block:'start'});toast('已生成家长报告，含具体两周安排；还不了解的内容不会编写成事实。')}
function render(){if(!f('assessmentMode'))current().fields.assessmentMode='quick';const st=STAGES[app.active];$('pageTitle').textContent=st.label+'学生首面规划';$('stageSubtitle').textContent='少填一点，先把问题说清楚，再确定两周能做的一件事。';['stageTabs','mobileStageTabs'].forEach(id=>$(id).innerHTML=Object.entries(STAGES).map(([k,v])=>`<button data-stage="${k}" class="${app.active===k?'active':''}" aria-pressed="${app.active===k}">${v.label}</button>`).join(''));$('formRoot').innerHTML='<div class="welcome-strip"><b>先填常用项，补充内容随时展开</b><span>快速首面：10个学习问题 · 不会的可以跳过 · 自动给出具体练法</span></div>'+section('basic','01','基本情况','先了解这次最想解决的问题',basicForm())+section('goals','02','升学目标梳理','先说眼前目标，长期想法可稍后补充',goalsForm())+section('school','03','当前学校情况','孩子跟不跟得上，有没有人能帮',schoolForm())+section('diagnosis','04','了解学习情况','点1—5分即可，不需要每项写一段话',diagnosisForm())+section('planning','05','看懂问题，定好练法','先做一件事：怎么做、做多少、谁检查',planningForm())+`<section id="result"><div class="footer-actions no-print"><div><h2 style="font-size:18px;margin:0">给家长看的两周学习安排</h2><p>把访谈整理成一份能带回家照着做的报告。</p></div><button class="primary" id="generateBottom">生成 / 更新家长报告 ↗</button></div><div class="no-print report-tools"><label>打印哪些内容？ <select id="printMode" style="width:auto"><option value="report">家长报告</option><option value="full">报告 + 本次填写记录</option></select></label><button id="copyReport">复制报告文字</button><span class="note">A4纵向，也可另存为PDF</span></div><div id="reportRoot"></div></section>`;updateLive();if(!current().reportGenerated)$('reportRoot').innerHTML='<div class="empty-report no-print">了解学习情况后，点击“生成家长报告”。<br>报告会写清：孩子卡在哪里、这两周具体练什么、怎样检查。</div>';if(!storageAvailable){$('saveStatus').textContent='本地保存不可用，请先备份';$('mobileSave').textContent='请导出备份，避免刷新后丢失。'}}
function demo(){if(!confirm('载入示例将替换本学段当前记录。需要保留请先备份。继续吗？'))return;const d=blank();d.fields={name:'示例同学',grade:STAGES[app.active].grades[app.active==='primary'?4:1],school:'示例学校',focusSubject:'数学',concern:'简单题大多会，综合题常常不知道先求什么。',goalDemand:'稳步提升 / 重点学校',assessmentMode:'quick',moduleExample_frame:'本周3道综合题，单独拆成小题都能做，合起来需要老师提醒。',normalSchool:app.active==='primary'?'适合孩子发展的初中':'目标重点高中',normalUni:app.active==='high'?'希望争取重点大学':'',interviewDate:localDate()};MODULES.forEach((m,mi)=>QUICK[m.id].forEach(i=>d.scores[m.id+'_'+i]=[4,2,3,4,3][mi]));app.stages[app.active]=d;save();render();toast('已载入10题示例，可查看综合题的具体练法。')}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){if(t.type==='number'&&t.validity.badInput)return;current().fields[t.dataset.field]=t.value;save();updateLive()}else if(t.dataset.evidence){current().evidence[t.dataset.evidence]=t.value;save();updateLive()}else if(t.dataset.pevidence){current().potentialEvidence[t.dataset.pevidence]=t.value;save();updateLive()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.include!==undefined){current().fields['include'+t.dataset.include]=t.checked?'1':'0';save();updateLive()}else if(t.dataset.check){current().fields[t.dataset.check]=[...document.querySelectorAll(`[data-check="${t.dataset.check}"]:checked`)].map(x=>x.value);save();updateLive()}else if(t.dataset.field){current().fields[t.dataset.field]=t.value;if(t.dataset.field==='assessmentMode'){delete current().fields.planIssue;save();render();$('diagnosis').scrollIntoView({block:'start'})}else{save();updateLive()}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.stage){app.active=t.dataset.stage;save();render();window.scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.score||t.dataset.potential){const prop=t.dataset.score?'scores':'potential',id=t.dataset.score||t.dataset.potential;current()[prop][id]=Number(t.dataset.value);t.closest('.rate-buttons').querySelectorAll('[data-value]').forEach(b=>{const selected=b.dataset.value===t.dataset.value;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});save();updateLive()}else if(t.dataset.clear||t.dataset.pclear){delete current()[t.dataset.clear?'scores':'potential'][t.dataset.clear||t.dataset.pclear];t.closest('.rate-buttons').querySelectorAll('[data-value]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});save();updateLive()}else if(['generateTop','generateBottom'].includes(t.id))generate();else if(t.id==='printBtn')printReport();else if(t.id==='resetBtn')resetStage();else if(t.id==='exportBtn')exportData();else if(t.id==='importBtn')$('importFile').click();else if(t.id==='copyReport')copyReport();else if(t.id==='demoBtn')demo()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('文件过大');const data=JSON.parse(await file.text());if(!validBackup(data))throw new Error('文件格式不正确，或评分不在1—5分范围');if(!confirm('恢复备份会替换三学段当前记录。继续吗？'))return;app=data;save();render();toast('已恢复备份；旧版详细记录仍保留，可切换到30项查看。')}catch(err){toast('恢复失败：'+err.message)}finally{e.target.value=''}});
window.addEventListener('beforeprint',()=>{renderReport();buildPrintSnapshot();document.body.classList.toggle('print-full',$('printMode')?.value==='full')});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('其他窗口修改了记录。请先备份当前内容，再刷新查看。')});
render();if(storageAvailable)$('mobileSave').textContent='内容自动保存在本浏览器；换学生前请先备份。';
</script>
</body></html>
